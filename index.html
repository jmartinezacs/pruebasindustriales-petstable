/* Barras de desplazamiento acordes al sitio */
html { scrollbar-color: #F58020 var(--soft); scrollbar-width: thin; }
.sidebar, .modal-body, .table-wrap, .combo-list, .tabs { scrollbar-width: thin; scrollbar-color: rgba(245, 128, 32, .8) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--soft); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #F58020, #FF9A2F); border-radius: 999px; border: 2px solid var(--soft); }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #E06A0C, #F58020); }
::-webkit-scrollbar-corner { background: transparent; }
.sidebar { scrollbar-color: rgba(245, 128, 32, .8) #090D12; }
.sidebar::-webkit-scrollbar-track { background: #090D12; }
.sidebar::-webkit-scrollbar-thumb { border-color: #090D12; }
.modal-body::-webkit-scrollbar-track, .table-wrap::-webkit-scrollbar-track, .combo-list::-webkit-scrollbar-track { background: transparent; }
.modal-body::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb, .combo-list::-webkit-scrollbar-thumb { border-color: var(--card); }

/* Botones flotantes */
.fabs { position: fixed; right: 24px; bottom: 24px; z-index: 450; display: flex; flex-direction: column; gap: 16px; }
.fab { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; color: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 10px 26px rgba(9, 13, 18, .28); transition: transform .15s, box-shadow .15s; }
.fab svg { width: 26px; height: 26px; }
.fab-cita { background: linear-gradient(135deg, #F58020, #FF9A2F); }
.fab-home { background: linear-gradient(135deg, #0B2235, #1B3A55); border: 2px solid rgba(27, 199, 199, .6); }
.fab:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 0 4px rgba(245, 128, 32, .25), 0 12px 30px rgba(245, 128, 32, .45); }
.fab-tip { position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: #102536; color: #fff; font-size: 12px; font-weight: 800;
  padding: 7px 11px; border-radius: 9px; opacity: 0; pointer-events: none; transition: opacity .15s; box-shadow: 0 8px 20px rgba(0, 0, 0, .2); }
.fab:hover .fab-tip, .fab:focus-visible .fab-tip { opacity: 1; }
.content { padding-bottom: 120px; }
.toasts { right: 100px; }
body.menu-open .fabs { display: none; }
@media (max-width: 720px) {
  .fabs { right: 14px; bottom: calc(78px + env(safe-area-inset-bottom)); gap: 12px; }
  .fab { width: 52px; height: 52px; }
  .fab svg { width: 23px; height: 23px; }
  .fab-tip { display: none; }
  .content { padding-bottom: calc(210px + env(safe-area-inset-bottom)); }
  .toasts { top: calc(var(--header-h) + 10px); bottom: auto; left: 12px; right: 12px; }
}
@media print { .fabs { display: none !important; } }

/* =====================================================================
   v1.3 · Login de una sola pantalla, logo mayor, barras de desplazamiento
   en el color del encabezado, disponibilidad, padecimientos y avisos
   ===================================================================== */
/* ---------- Login: todo visible sin desplazarse ---------- */
.login { position: relative; display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  background: linear-gradient(160deg, #0B2235 0%, #07131E 60%, #090D12 100%); padding: 12px 16px; }
.login-glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; }
.login-glow.g1 { width: 46vmax; height: 46vmax; left: -14vmax; bottom: -18vmax; background: rgba(27, 199, 199, .45); }
.login-glow.g2 { width: 40vmax; height: 40vmax; right: -12vmax; top: -16vmax; background: rgba(245, 128, 32, .5); }
.login-wrap { position: relative; z-index: 1; width: min(420px, 100%); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 16px); }
.login-logo { width: clamp(96px, 16vh, 140px); height: clamp(76px, 12.7vh, 111px); }
.login-card { width: 100%; text-align: center; padding: clamp(16px, 3vh, 28px) clamp(18px, 4vw, 30px); border-radius: 22px;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.login-card .app-icon { width: clamp(44px, 7vh, 60px); height: clamp(44px, 7vh, 60px); border-radius: 15px; display: block; margin: 0 auto; box-shadow: 0 8px 20px rgba(245, 128, 32, .3); }
.login-card h1 { margin: clamp(6px, 1.4vh, 12px) 0 2px; font-size: clamp(20px, 3.2vh, 26px); letter-spacing: -.02em; color: var(--text); }
.login-sub { margin: 0 0 clamp(8px, 2vh, 16px); color: var(--muted); font-size: 12.5px; }
.login-card .field { margin: clamp(5px, 1.2vh, 10px) 0; text-align: center; }
.login-card .field label { text-align: center; }
.login-card .field input { text-align: center; min-height: clamp(40px, 5.6vh, 46px); }
.login-card .pw-wrap input { padding-left: 46px !important; }
.login-card .login-options { flex-direction: column; justify-content: center; gap: 4px; margin: clamp(4px, 1vh, 8px) 0 clamp(8px, 1.6vh, 14px); }
.login-card .btn.lg { min-height: clamp(42px, 6vh, 48px); }
.login-chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: clamp(8px, 1.8vh, 14px); }
.login-chips span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; }
.login-chips svg { width: 13px; height: 13px; color: var(--orange); }
.login-foot { color: #7E93A3; font-size: 11px; }
.login .login-msg { text-align: center; }
@media (max-height: 640px) { .login-chips, .login-foot { display: none; } .login-card .login-options { flex-direction: row; justify-content: space-between; } }
@media (max-height: 540px) { .login-logo, .login-card .app-icon { display: none; } }

/* ---------- Logo del encabezado más grande ---------- */
.top-logo { height: 52px; width: 66px; }
@media (max-width: 720px) { .top-logo { height: 40px; width: 50px; } }

/* ---------- Barras de desplazamiento en el color del encabezado ---------- */
html { scrollbar-color: #1B2A36 var(--soft); }
.sidebar, .modal-body, .table-wrap, .combo-list, .tabs { scrollbar-color: #2A3B49 transparent; }
::-webkit-scrollbar-thumb { background: #1B2A36; border: 2px solid var(--soft); }
::-webkit-scrollbar-thumb:hover { background: #090D12; }
.sidebar { scrollbar-color: #2D3D4B #090D12; }
.sidebar::-webkit-scrollbar-thumb { background: #2D3D4B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb { background: #2D4253; } :root:not([data-theme="light"]) { scrollbar-color: #2D4253 var(--soft); } }
:root[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #2D4253; }
:root[data-theme="dark"] { scrollbar-color: #2D4253 var(--soft); }

/* ---------- Cambio de tema inmediato ---------- */
body { transition: none; }

/* ---------- Disponibilidad de citas en el panel ---------- */
.avail { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 20px 24px; border-radius: 20px; margin-bottom: 16px;
  border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--card); }
.avail::before { content: ""; position: absolute; inset: 0; background: radial-gradient(500px 200px at 0% 50%, rgba(22, 163, 74, .14), transparent 70%); pointer-events: none; }
.avail.lleno::before { background: radial-gradient(500px 200px at 0% 50%, rgba(220, 38, 38, .12), transparent 70%); }
.avail.cerrado::before { background: radial-gradient(500px 200px at 0% 50%, rgba(27, 199, 199, .14), transparent 70%); }
.avail-ring { position: relative; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(#16A34A calc(var(--p) * 1%), var(--soft) 0); }
.avail.lleno .avail-ring { background: conic-gradient(#DC2626 calc(var(--p) * 1%), var(--soft) 0); }
.avail.cerrado .avail-ring { background: conic-gradient(#1BC7C7 calc(var(--p) * 1%), var(--soft) 0); }
.avail-ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--card); }
.avail-ring b { position: relative; z-index: 1; font-size: 26px; line-height: 1; text-align: center; }
.avail-ring small { display: block; font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.avail-txt { position: relative; min-width: 0; }
.avail-tag { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; color: #fff; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: #16A34A; }
.avail-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.2s ease-in-out infinite; }
.avail.lleno .avail-tag { background: #DC2626; }
.avail.cerrado .avail-tag { background: #0891B2; }
.avail-txt h3 { margin: 8px 0 4px; font-size: 19px; letter-spacing: -.01em; }
.avail-txt p { margin: 0; color: var(--muted); font-size: 12px; }
.avail-slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.avail-slots button { border: 1px solid rgba(22, 163, 74, .4); background: rgba(22, 163, 74, .1); color: #15803D; font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 9px; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .avail-slots button { color: #4ADE80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avail-slots button { color: #4ADE80; } }
.avail-slots .more { color: var(--muted); font-size: 12px; align-self: center; }
.avail-cta { position: relative; }
@media (max-width: 760px) {
  .avail { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 12px; }
  .avail-slots { justify-content: center; }
}

/* ---------- Estadísticas por padecimiento ---------- */
.dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.total-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 11px; border-radius: 999px; background: #0B2235; color: #fff; font-weight: 900; font-size: 11.5px; }
.total-badge b { color: #FFB36B; font-size: 13px; }
.section-label { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 24px 0 12px; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--text); }
.section-label::before, .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Avisos / notificaciones ---------- */
.notif-banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; margin-bottom: 16px; background: linear-gradient(135deg, rgba(245, 128, 32, .12), rgba(27, 199, 199, .1)); border: 1px solid rgba(245, 128, 32, .35); }
.notif-banner .nb-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #F58020; color: #fff; flex: 0 0 auto; }
.notif-banner .nb-txt { flex: 1; min-width: 0; }
.notif-banner b { display: block; font-size: 13.5px; }
.notif-banner span { color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .notif-banner { flex-wrap: wrap; justify-content: center; text-align: center; } }

/* Galería de fotos existentes */
.photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; max-height: 50vh; overflow-y: auto; padding: 4px; }
.photo-gallery button { border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.photo-gallery button:hover, .photo-gallery button.sel { border-color: var(--orange); }
.photo-gallery img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
.photo-gallery span { font-size: 10.5px; color: var(--text); text-align: center; overflow-wrap: anywhere; }
.acc-results { display: grid; gap: 6px; margin-top: 8px; max-height: 260px; overflow-y: auto; }
.acc-results button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; color: var(--text); }
.acc-results button:disabled { opacity: .55; cursor: not-allowed; }
.acc-results .acc-main { flex: 1; min-width: 0; }
.acc-results b { display: block; font-size: 12.5px; }
.acc-results small { color: var(--muted); font-size: 11px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.switch-row input { width: 20px; height: 20px; accent-color: var(--orange); }
.acc-results button.sel { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245, 128, 32, .18); }

/* =====================================================================
   v1.4 · Menús desplegables propios, tabla de usuarios, urgencias
   ===================================================================== */
/* ---------- Menús desplegables (select / sugerencias) ---------- */
.cs { position: relative; display: block; width: 100%; min-width: 0; }
.toolbar .cs { display: inline-block; width: auto; min-width: 150px; flex: 0 1 auto; }
.pager .cs { width: auto; min-width: 130px; }
.cs-native { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; opacity: 0 !important; pointer-events: none !important; }
.cs-btn { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px 0 14px;
  border: 1px solid var(--input-line); border-radius: 11px; background: var(--input); color: var(--text); font-size: 13.5px; font-weight: 600; text-align: left;
  transition: border-color .12s, box-shadow .12s; cursor: pointer; }
.toolbar .cs-btn { min-height: 40px; font-size: 12.5px; border-radius: 10px; }
.pager .cs-btn { min-height: 34px; font-size: 12px; border-radius: 9px; }
.cs-btn:hover:not(:disabled) { border-color: var(--orange) !important; box-shadow: 0 0 0 3px rgba(245, 128, 32, .14) !important; }
.cs-btn:focus-visible, .cs-btn[aria-expanded="true"] { outline: none; border-color: var(--turq); box-shadow: 0 0 0 3px rgba(27, 199, 199, .18); }
.cs-btn:disabled { opacity: .6; cursor: not-allowed; }
.cs-val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-val.ph { color: var(--muted); font-weight: 500; }
.cs-chev { flex: 0 0 auto; color: var(--orange); transition: transform .15s; }
.cs-btn[aria-expanded="true"] .cs-chev { transform: rotate(180deg); }
.field.invalid .cs-btn { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(224, 70, 78, .1); }
.cs-panel { position: fixed; z-index: 3000; max-height: 300px; overflow-y: auto; padding: 6px; border-radius: 14px; background: var(--card);
  border: 1px solid var(--line); box-shadow: 0 18px 44px rgba(9, 13, 18, .25); animation: pop .12s ease; scrollbar-width: thin; }
.cs-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 9px; font-size: 13px; color: var(--text); cursor: pointer; }
.cs-opt.ph { color: var(--muted); }
.cs-opt.hl { background: var(--soft); }
.cs-opt.sel { background: rgba(245, 128, 32, .12); color: #C2560A; font-weight: 800; }
:root[data-theme="dark"] .cs-opt.sel { color: #FFB36B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cs-opt.sel { color: #FFB36B; } }
.cs-opt.sel svg { color: var(--orange); flex: 0 0 auto; }
.cs-opt.dis { opacity: .45; cursor: not-allowed; }
.cs-dl { position: relative; }

/* ---------- Tabla de usuarios: fotos alineadas, campana y puesto ---------- */
.table th.col-user, .table td.col-user { text-align: left; padding-left: 22px; }
.table td.col-user .user-cell { justify-content: flex-start; }
.user-photo { position: relative; flex: 0 0 auto; display: inline-flex; }
.user-txt { min-width: 0; }
.bell-badge { position: absolute; right: -7px; bottom: -5px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); box-shadow: 0 2px 7px rgba(9, 13, 18, .25); animation: bellSwing 2.4s ease-in-out infinite; transform-origin: 50% 20%; }
@keyframes bellSwing { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(14deg); } 82% { transform: rotate(-12deg); } 89% { transform: rotate(6deg); } }
.puesto-txt { font-size: 11.5px; font-weight: 800; color: var(--text); }
@media (max-width: 720px) { .table-wrap.responsive td.col-user { padding-left: 10px; text-align: right; } .table-wrap.responsive td.col-user .user-cell { justify-content: flex-end; } }

/* ---------- Citas de urgencia ---------- */
.urg-switch { margin-bottom: 10px; border-color: rgba(220, 38, 38, .35); background: rgba(220, 38, 38, .06); cursor: pointer; }
.urg-switch b { display: inline-flex; align-items: center; gap: 6px; color: #B91C1C; }
:root[data-theme="dark"] .urg-switch b { color: #FCA5A5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .urg-switch b { color: #FCA5A5; } }
.urg-switch input { accent-color: #DC2626; }
.urg-btn { background: linear-gradient(135deg, #DC2626, #F87171); color: #fff; box-shadow: 0 7px 16px rgba(220, 38, 38, .22); margin-top: 8px; }
.avail-cta { display: flex; flex-direction: column; align-items: stretch; }
.agenda-slot.urg { border-color: rgba(220, 38, 38, .4); background: rgba(220, 38, 38, .05); }

/* =====================================================================
   v1.5 · Pantalla de acceso siempre en modo oscuro
   (independiente del tema elegido dentro del sitio)
   ===================================================================== */
.login {
  --card: #0D1B26; --soft: #122431; --text: #EEF3F7; --muted: #93A5B3; --line: #213443;
  --input: #0F202C; --input-line: #2A4152; --bad: #FF8A90; --bad-bg: rgba(255, 138, 144, .12); --bad-line: rgba(255, 138, 144, .32);
  --info: #5FE0E0; --info-bg: rgba(95, 224, 224, .12); --info-line: rgba(95, 224, 224, .3);
  color-scheme: dark; color: var(--text);
}
.login .login-card { background: rgba(13, 27, 38, .92); border-color: rgba(255, 255, 255, .08); backdrop-filter: blur(6px); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
.login .field label { color: #B9C8D3; }
.login .field input { color: var(--text); }
.login .field input::placeholder { color: #6F8697; }
.login .check { color: #B9C8D3; }
.login .link-btn { color: #5FE0E0; }
.login .pw-toggle { color: #93A5B3; }
.login-chips span { background: rgba(255, 255, 255, .05); border-color: rgba(255, 255, 255, .1); color: #B9C8D3; }
/* Autocompletado del navegador sin fondo claro */
.login input:-webkit-autofill, .login input:-webkit-autofill:hover, .login input:-webkit-autofill:focus {
  -webkit-text-fill-color: #EEF3F7; caret-color: #EEF3F7;
  -webkit-box-shadow: 0 0 0 1000px #0F202C inset; box-shadow: 0 0 0 1000px #0F202C inset; transition: background-color 9999s;
}

/* =====================================================================
   Pruebas industriales · componentes propios (complementa app.css)
   ===================================================================== */

/* ---------- Utilidades ---------- */
.link { color: var(--turq-strong); font-weight: 700; text-decoration: none; }
.link:hover { text-decoration: underline; }
.cell-main.link { display: inline-block; }
.btn.danger-text { color: var(--bad); }
.btn.danger-text:hover { background: var(--bad-bg); }
.field .label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 6px; color: var(--muted); }
.field .label .req { color: var(--orange); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; align-items: center; }
.avatar.xs { width: 24px; height: 24px; font-size: 10px; }
.pill.violet { background: #7C3AED; color: #fff; border: 0; }
.info-box .user-cell { display: flex; align-items: center; gap: 8px; }
.dot.off { background: #94A3B8; box-shadow: 0 0 0 6px rgba(148, 163, 184, .16); }

/* Filas de tablas */
.table tr.row-link { cursor: pointer; }
.table tr.row-link:hover td { background: var(--soft); }
.table tr.row-late td { background: rgba(224, 70, 78, .06); }
.table tr.row-late td:first-child { box-shadow: inset 3px 0 0 #E0464E; }
.table tr.row-bad td { background: rgba(224, 70, 78, .05); }
.date-chip.late { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad); }

/* Barra de avance en la lista de pruebas */
.mini-progress { height: 6px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; width: 110px; margin: 0 auto 4px; }
.mini-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--orange), var(--turq)); border-radius: 99px; }

/* ---------- Encabezado de la prueba ---------- */
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 800; font-size: 13px; text-decoration: none; margin-bottom: 10px; }
.back-link:hover { color: var(--orange); }
.back-link svg { width: 16px; height: 16px; }
.prueba-head { padding: 20px 22px; }
.ph-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.ph-title { min-width: 0; }
.ph-title h1 { margin: 4px 0 4px; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; overflow-wrap: anywhere; }
.ph-title p { margin: 0; color: var(--muted); font-size: 13px; }
.ph-estado .pill { font-size: 12px; padding: 6px 12px; }
.ph-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.next-step { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 11px 13px; border-radius: 12px;
  background: linear-gradient(135deg, rgba(245, 128, 32, .1), rgba(27, 199, 199, .08)); border: 1px solid rgba(245, 128, 32, .3); font-size: 13px; }
.next-step svg { width: 18px; height: 18px; color: var(--orange); flex: 0 0 auto; margin-top: 1px; }

/* Avance por estados */
.stepper { list-style: none; display: flex; margin: 18px 0 0; padding: 0; counter-reset: s; }
.stepper li { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.stepper li::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.current::before { background: var(--orange); }
.st-dot { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px;
  background: var(--card); border: 2px solid var(--line); color: var(--muted); }
.st-dot svg { width: 16px; height: 16px; }
.stepper li.done .st-dot { background: var(--orange); border-color: var(--orange); color: #fff; }
.stepper li.current .st-dot { border-color: var(--orange); color: var(--orange); box-shadow: 0 0 0 5px rgba(245, 128, 32, .18); }
.stepper li.aprobada .st-dot { background: #16A34A; border-color: #16A34A; }
.stepper li.rechazada .st-dot { background: #DC2626; border-color: #DC2626; }
.st-lbl { font-size: 11.5px; font-weight: 800; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.stepper li.current .st-lbl, .stepper li.done .st-lbl { color: var(--text); }
.stepper.is-cancelled { opacity: .5; filter: grayscale(1); }

/* Insignias en pestañas */
.tab-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--orange-soft); color: #C25E0B; font-size: 11px; font-weight: 900; display: inline-grid; place-items: center; }
.tabs button.active .tab-badge { background: var(--orange); color: #fff; }

/* Dictámenes */
.dictamen { border: 1px solid var(--line); border-left: 4px solid var(--gray); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--soft); }
.dictamen small { display: block; color: var(--muted); font-size: 10.5px; text-transform: uppercase; font-weight: 900; letter-spacing: .05em; }
.dictamen b { display: block; font-size: 17px; margin: 4px 0 2px; }
.dictamen p { margin: 8px 0 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.dictamen.ok { border-left-color: #16A34A; } .dictamen.ok b { color: #16A34A; }
.dictamen.bad { border-left-color: #DC2626; } .dictamen.bad b { color: #DC2626; }
.dictamen.pending b { color: var(--muted); }

/* Opciones tipo tarjeta (dictámenes) */
.radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.radio-cards label { position: relative; cursor: pointer; margin: 0; }
.radio-cards input { position: absolute; opacity: 0; pointer-events: none; }
.radio-cards span { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--card); font-weight: 900; font-size: 14px; color: var(--text); transition: border-color .12s, box-shadow .12s; }
.radio-cards input:focus-visible + span { box-shadow: 0 0 0 3px rgba(245, 128, 32, .3); }
.radio-cards input:checked + span { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245, 128, 32, .18); }
.radio-cards input[value="conforme"]:checked + span, .radio-cards input[value="aprobada"]:checked + span { border-color: #16A34A; color: #16A34A; box-shadow: 0 0 0 3px rgba(22, 163, 74, .16); }
.radio-cards input[value="no_conforme"]:checked + span, .radio-cards input[value="rechazada"]:checked + span { border-color: #DC2626; color: #DC2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, .16); }

/* Casillas tipo tarjeta (funciones, tipos) */
.check-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.check-card { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; margin: 0 !important; }
.check-card input { width: 17px; height: 17px; accent-color: var(--orange); margin-top: 2px; flex: 0 0 auto; }
.check-card b { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.check-card b svg { width: 15px; height: 15px; color: var(--orange); }
.check-card small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 500; margin-top: 2px; }
.check-card:has(input:checked) { border-color: var(--orange); background: var(--orange-soft); }

/* Chips de funciones y responsables */
.fn-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 800;
  background: var(--turq-soft); color: var(--turq-strong); margin: 2px 0; white-space: nowrap; }
.fn-chip svg { width: 12px; height: 12px; }
.fn-chip.alt { background: var(--orange-soft); color: #C25E0B; }
.resp-list { display: flex; flex-wrap: wrap; gap: 8px; }
.resp-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); font-size: 12.5px; font-weight: 700; }
.resp-chip button { border: 0; background: none; color: var(--muted); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }
.resp-chip button:hover { color: var(--bad); background: var(--bad-bg); }
.resp-chip button svg { width: 14px; height: 14px; }
.tipo-card.inactive { opacity: .65; }

/* ---------- Pendientes del panel ---------- */
.pend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.pend-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  text-align: left; cursor: pointer; color: inherit; transition: transform .12s, box-shadow .12s, border-color .12s; }
.pend-item:hover { transform: translateY(-2px); border-color: var(--orange); box-shadow: 0 10px 24px rgba(245, 128, 32, .16); }
.pend-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); flex: 0 0 auto; }
.pend-ico svg { width: 19px; height: 19px; }
.pend-txt { flex: 1; min-width: 0; }
.pend-txt b { display: block; font-size: 13px; }
.pend-txt small { display: block; color: var(--muted); font-size: 11.5px; }
.pend-n { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 16px; background: var(--orange); color: #fff; }

/* ---------- Seguimiento ---------- */
.note-form { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
.note-form .field { flex: 1; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 4px; position: relative; }
.timeline::before { content: ""; position: absolute; left: 19px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; display: flex; gap: 12px; padding: 6px 0; }
.tl-ico { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
  background: var(--card); border: 2px solid var(--line); color: var(--muted); }
.tl-ico svg { width: 15px; height: 15px; }
.tl-ico.sm { width: 36px; height: 36px; }
.tl-nota .tl-ico { border-color: var(--turq); color: var(--turq-strong); }
.tl-estado .tl-ico { border-color: var(--orange); color: var(--orange); background: var(--orange-soft); }
.tl-body { flex: 1; min-width: 0; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.tl-estado .tl-body { border-color: rgba(245, 128, 32, .35); }
.tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.tl-head span { color: var(--muted); font-size: 11.5px; }
.tl-body p { margin: 4px 0 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Adjuntos */
.file-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--turq-soft); color: var(--turq-strong); flex: 0 0 auto; }
.file-ico svg { width: 18px; height: 18px; }

/* ===================== v2 · flujo de seis etapas ===================== */
.ok-txt { color: var(--ok); font-weight: 700; }
.bad-txt { color: var(--bad); font-weight: 700; }
.warn-txt { color: var(--warn); font-weight: 700; }
.mt-s { margin-top: 8px; }
.head-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.table tr.row-off td { opacity: .55; }
.table tr.row-hl td { background: var(--orange-soft); }
.table tr.row-urg td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.next-step.mine { background: linear-gradient(135deg, rgba(245, 128, 32, .2), rgba(245, 128, 32, .08)); border-color: var(--orange); }
.next-step.mine svg { color: #C25E0B; }

/* Ayuda contextual */
.help { position: relative; display: inline-grid; place-items: center; width: 18px; height: 18px; vertical-align: -3px; margin-left: 4px; color: var(--turq-strong); cursor: help; border-radius: 50%; outline: none; }
.help svg { width: 15px; height: 15px; }
.help::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: min(260px, 70vw);
  padding: 8px 10px; border-radius: 10px; background: #0E1E2B; color: #fff; font-size: 12px; font-weight: 600; line-height: 1.35; text-transform: none; letter-spacing: 0;
  white-space: normal; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); pointer-events: none; z-index: 4000; display: none; }
.help:hover::after, .help:focus::after { display: block; }
@media (max-width: 720px) {
  /* En teléfono la ayuda aparece abajo, a todo lo ancho, sin salirse de la pantalla */
  .help::after { position: fixed; left: 16px; right: 16px; bottom: 16px; top: auto; transform: none; width: auto; max-width: none; font-size: 13px; padding: 12px 14px; }
}
.help:focus-visible { box-shadow: 0 0 0 3px rgba(27, 199, 199, .35); }
.form-section { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin: 6px 0 -4px; font-size: 12px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--orange); }
.form-section:first-child { margin-top: 0; }
details.mas-datos { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; }
details.mas-datos > summary { cursor: pointer; font-weight: 800; font-size: 13px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.mas-datos > summary::-webkit-details-marker { display: none; }
details.mas-datos > summary svg { width: 16px; height: 16px; }
details.mas-datos[open] > summary { margin-bottom: 10px; }
details.hist > summary { cursor: pointer; font-weight: 800; display: flex; align-items: center; gap: 8px; }
details.hist > summary svg { width: 17px; height: 17px; color: var(--muted); }

/* Captura por batch / corrida */
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 12px; border-radius: 9px; gap: 5px; }
.btn.sm svg { width: 15px; height: 15px; }
.cap-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.form-grid > .cap-item { grid-column: 1 / -1; }
.cap-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 4px 10px; align-items: center; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.cap-item.nc { border-color: var(--bad-line); background: var(--bad-bg); }
.cap-lbl { font-size: 13px; font-weight: 800; color: var(--text); min-width: 0; }
.cap-in { display: flex; gap: 6px; min-width: 0; }
.cap-in input, .cap-in select, .cap-just input { width: 100%; min-height: 38px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--input-line, var(--line));
  background: var(--input, var(--card)); color: var(--text); font: inherit; font-size: 14px; }
.cap-in select + select, .cap-in input + select { max-width: 48%; }
.cap-in .dil-grid { width: 100%; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
.cap-in .dil-grid input { min-height: 36px; }
.cap-just { grid-column: 1 / -1; }
.cap-item:has(.dil-grid) { grid-template-columns: minmax(0, 1fr); }

/* Buscador dentro de las listas desplegables */
.cs-search { position: sticky; top: -6px; z-index: 1; margin: -6px -6px 6px; padding: 8px; background: var(--card); border-bottom: 1px solid var(--line); }
.cs-search input { width: 100%; min-height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--input-line, var(--line)); background: var(--input, var(--soft)); color: var(--text); font: inherit; font-size: 13px; }

/* Opciones segmentadas con radio (prioridad, asignar a) */
.seg-opt { position: relative; margin: 0; cursor: pointer; }
.seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg-opt span { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 8px; font-weight: 800; font-size: 12.5px; color: var(--muted); }
.seg-opt input:checked + span { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
.seg-opt input:focus-visible + span { box-shadow: 0 0 0 3px rgba(245, 128, 32, .3); }
.seg-opt input[value="alta"]:checked + span { color: var(--warn); }
.seg-opt input[value="urgente"]:checked + span { color: var(--bad); }
div.seg-opt { display: inline-flex; border: 1px solid var(--line); border-radius: 11px; padding: 3px; background: var(--soft); gap: 3px; }
div.seg-opt label { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font-weight: 800; font-size: 12.5px; cursor: pointer; margin: 0; }
div.seg-opt label:has(input:checked) { background: var(--card); box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
div.seg-opt input { accent-color: var(--orange); }

/* Lista de verificación de requisitos */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checklist li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
.checklist li svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 1px; }
.checklist li.ok svg { color: var(--ok); }
.checklist li.no { color: var(--muted); }
.checklist li.no svg { color: var(--warn); }

/* Listas de casillas */
.chk-list { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.chk-list label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; margin: 0; }
.chk-list label:hover { background: var(--card); }
.chk-list input { width: 16px; height: 16px; accent-color: var(--orange); flex: 0 0 auto; }
.chk-list.inline { display: flex; flex-wrap: wrap; max-height: none; }

/* Edición en línea dentro de tablas */
.inline-num { width: 110px; min-height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--input-line, var(--line)); background: var(--input, var(--card)); color: var(--text); font: inherit; font-size: 13px; }
.inline-sel { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
.inline-sel select { min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0 8px; font: inherit; }

/* Plan de evaluación agrupado */
.plan-grupo + .plan-grupo { margin-top: 14px; }
.plan-grupo .section-title { margin-top: 4px; }

/* Lotes diarios (ejecución) */
.lote-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); }
.lote-card + .lote-card { margin-top: 12px; }
.lote-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.lote-head > div { flex: 1; min-width: 0; }
.lote-head b { display: block; font-size: 14px; }
.lote-head span { color: var(--muted); font-size: 12px; }

/* Evaluación */
.muestra-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); font-size: 12px; font-weight: 700; }
.muestra-chip svg { width: 14px; height: 14px; color: var(--turq-strong); }
.muestra-chip .icon-btn { width: 24px; height: 24px; }
.eval-item { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card); }
.eval-item + .eval-item { margin-top: 10px; }
.eval-item.done { border-left-color: var(--ok); }
.eval-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.eval-head b { font-size: 14px; }
.dil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.dil-grid label { display: grid; gap: 4px; font-size: 12px; font-weight: 800; color: var(--muted); margin: 0; }
.radio-cards input:disabled + span { opacity: .45; cursor: not-allowed; }
.radio-cards.multi { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.radio-cards.multi span { padding: 11px; font-size: 13px; }
.radio-cards input[value="ausencia"]:checked + span, .radio-cards input[value="cumple"]:checked + span { border-color: #16A34A; color: #16A34A; }
.radio-cards input[value="presencia"]:checked + span, .radio-cards input[value="no_cumple"]:checked + span, .radio-cards input[value="requiere_repeticion"]:checked + span { border-color: #DC2626; color: #DC2626; }

/* Dictamen */
.nc-line { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.nc-line:last-child { border-bottom: 0; }

/* Etapas en la lista de pruebas */
.etapas-mini { display: inline-flex; gap: 3px; }
.etapas-mini span { width: 14px; height: 6px; border-radius: 99px; background: var(--line); }
.etapas-mini span.done { background: var(--orange); }
.etapas-mini span.cur { background: var(--turq); box-shadow: 0 0 0 2px rgba(27, 199, 199, .25); }
.etapas-mini span.off { background: var(--line); opacity: .6; }

/* Pendientes agrupados por acción */
.pend-col { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px; display: grid; gap: 6px; align-content: start; }
.pend-col-head { display: flex; align-items: center; gap: 10px; padding: 2px 2px 6px; }
.pend-col-head b { flex: 1; font-size: 13.5px; }
.pend-col-head .pend-n { min-width: 28px; height: 28px; font-size: 13px; border-radius: 8px; }
.pend-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--soft); color: inherit; cursor: pointer; font: inherit; transition: border-color .12s, transform .12s; }
.pend-row:hover { border-color: var(--orange); transform: translateY(-1px); }
.pend-row b { font-size: 12px; color: var(--orange); white-space: nowrap; }
.pend-row span { font-size: 13px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pend-row small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; }

/* Catálogos y recetas: navegación lateral */
.cat-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.cat-nav { display: grid; gap: 4px; position: sticky; top: 84px; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); max-height: calc(100vh - 110px); overflow-y: auto; }
.cat-nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; text-align: left; cursor: pointer; }
.cat-nav button svg { width: 17px; height: 17px; color: var(--muted); flex: 0 0 auto; }
.cat-nav button span { min-width: 0; }
.cat-nav button small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
.cat-nav button:hover { background: var(--soft); }
.cat-nav button.active { background: var(--orange-soft); color: #C25E0B; }
.cat-nav button.active svg { color: var(--orange); }
.cat-nav button.off { opacity: .55; }
.version-card { border-left: 4px solid var(--line); }
.version-card.vigente { border-left-color: var(--ok); }
.version-card.borrador { border-left-color: var(--warn); }
.version-card.historica { opacity: .8; }

/* ---------- Responsivo ---------- */
@media (max-width: 900px) {
  .cat-layout { grid-template-columns: minmax(0, 1fr); }
  .cat-nav { position: static; max-height: none; display: flex; overflow-x: auto; scrollbar-width: thin; }
  .cat-nav button { flex: 0 0 auto; white-space: nowrap; }
  .cat-nav button small { display: none; }
}
@media (max-width: 720px) {
  .cap-grid { grid-template-columns: minmax(0, 1fr); }
  .cap-item { grid-template-columns: minmax(0, 1fr); }
  .head-btns { justify-content: flex-start; width: 100%; }
  .head-btns .btn { flex: 1 1 auto; }
  .prueba-head { padding: 16px; }
  .ph-top { flex-direction: column-reverse; }
  .ph-title h1 { font-size: 20px; }
  .ph-actions .btn { flex: 1 1 calc(50% - 8px); }
  .st-lbl { font-size: 10px; }
  .st-dot { width: 28px; height: 28px; }
  .stepper li::before { top: 13px; }
  .radio-cards, .check-grid { grid-template-columns: minmax(0, 1fr); }
  .note-form { flex-direction: column; align-items: stretch; }
  .pend-grid { grid-template-columns: minmax(0, 1fr); }
  .mini-progress { margin: 0 0 4px auto; }
}
@media (max-width: 420px) {
  .ph-actions .btn { flex: 1 1 100%; }
}

/* v4 · Parámetros por área (registro, expediente y resultados) */
.area-block { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); margin-bottom: 10px; min-width: 0; }
.area-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.area-head > svg { width: 22px; height: 22px; padding: 6px; box-sizing: content-box; border-radius: 10px; color: var(--orange); background: var(--orange-soft); flex: 0 0 auto; }
.area-head b { display: block; font-size: 14px; }
.area-head span { display: block; font-size: 12px; color: var(--muted); }
.area-toggle { display: flex; align-items: center; gap: 8px; margin: 0 0 8px !important; font-weight: 700; font-size: 13px; }
.area-toggle input { width: 17px; height: 17px; accent-color: var(--orange); }
.sub-title { font-size: 11.5px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 10px 0 6px; display: flex; align-items: center; gap: 6px; }
.chk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
.chk-param { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 9px; font-size: 13px; cursor: pointer; margin: 0 !important; }
.chk-param:hover { background: var(--soft); }
.chk-param input { width: 16px; height: 16px; accent-color: var(--orange); margin-top: 2px; flex: 0 0 auto; }
.chk-param:has(input:checked) { background: var(--orange-soft); }
.areas-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.areas-grid .area-block { margin: 0; }
.param-list { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 2px; }
.param-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 6px; border-radius: 8px; font-size: 13px; }
.param-list li:hover { background: var(--soft); }
.param-list .icon-btn { width: 28px; height: 28px; }
.input-group { display: flex; gap: 6px; }
.input-group input { flex: 1 1 auto; min-width: 0; }
.input-group select { flex: 0 0 92px; }
.area-avance { display: grid; gap: 6px; }
.seg.sm .seg-opt span { padding: 6px 10px; font-size: 12px; }
.seg-opt.ok input:checked + span { background: var(--ok-bg); color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok-line); }
.seg-opt.bad input:checked + span { background: var(--bad-bg); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad-line); }
.res-table td input { width: 100%; min-width: 160px; }
.res-table .bad-txt svg { width: 14px; height: 14px; vertical-align: -2px; }
.form-foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.form-foot .form-error { margin-right: auto; color: var(--bad); font-weight: 700; font-size: 13px; }
.radio-cards span small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.radio-cards.multi span { flex-direction: column; text-align: center; gap: 2px; }
.radio-cards input[value="favorable"]:checked + span { border-color: #16A34A; color: #16A34A; box-shadow: 0 0 0 3px rgba(22, 163, 74, .16); }
.radio-cards input[value="no_favorable"]:checked + span { border-color: #DC2626; color: #DC2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, .16); }
p.pre { white-space: pre-wrap; margin: 8px 0 0; }
.card-head h3 svg { width: 18px; height: 18px; vertical-align: -3px; color: var(--orange); }
@media (max-width: 720px) {
  .chk-grid, .areas-grid { grid-template-columns: 1fr; }
  .res-table td input { min-width: 0; }
}
.seg { flex-wrap: wrap; max-width: 100%; }

/* v4.1 · Prioridad llamativa y áreas */
.prio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.prio-cards label { position: relative; margin: 0; cursor: pointer; }
.prio-cards input { position: absolute; opacity: 0; pointer-events: none; }
.prio-cards span { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); transition: border-color .15s, background .15s, box-shadow .15s; height: 100%; box-sizing: border-box; }
.prio-cards span svg { width: 24px; height: 24px; color: var(--muted); }
.prio-cards b { font-size: 14px; }
.prio-cards small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.prio-cards input:focus-visible + span { box-shadow: 0 0 0 3px rgba(245, 128, 32, .3); }
.prio-cards .prio-normal input:checked + span { border-color: var(--ok); background: var(--ok-bg); }
.prio-cards .prio-normal input:checked + span svg, .prio-cards .prio-normal input:checked + span b { color: var(--ok); }
.prio-cards .prio-alta input:checked + span { border-color: var(--warn); background: var(--warn-bg, rgba(245, 158, 11, .12)); }
.prio-cards .prio-alta input:checked + span svg, .prio-cards .prio-alta input:checked + span b { color: var(--warn); }
.prio-cards .prio-urgente input:checked + span { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 0 0 3px rgba(220, 38, 38, .14); }
.prio-cards .prio-urgente input:checked + span svg, .prio-cards .prio-urgente input:checked + span b { color: var(--bad); }
.area-head .area-tag { margin-left: auto; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); white-space: nowrap; align-self: flex-start; }
.area-head .area-tag.opt { background: var(--soft); color: var(--muted); }
.area-block.off { opacity: .75; }
.area-nota { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px; }
.area-nota svg { width: 15px; height: 15px; flex: 0 0 auto; }
.area-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
@media (max-width: 520px) {
  .prio-cards { grid-template-columns: 1fr; }
  .prio-cards span { flex-direction: row; text-align: left; padding: 10px 12px; }
  .prio-cards small { margin-left: auto; text-align: right; max-width: 55%; }
}

/* v4.1 · Aviso de nueva versión publicada */
.update-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 600; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 999px; background: #0D1B26; color: #EEF3F7; box-shadow: 0 12px 32px rgba(0, 0, 0, .28); font-size: 13px; max-width: calc(100vw - 32px); }
.update-bar.hidden { display: none; }
.update-bar > svg { color: #FFC163; flex: 0 0 auto; }
.update-bar .icon-btn { color: #B9C8D3; }
@media (max-width: 760px) {
  .update-bar { left: 12px; right: 12px; transform: none; max-width: none; bottom: auto; top: calc(var(--header-h, 64px) + 8px + env(safe-area-inset-top)); border-radius: 16px; padding: 8px 8px 8px 12px; font-size: 12.5px; }
  .update-bar > span { flex: 1 1 auto; min-width: 0; }
}

/* v4.2 · Registro flexible (toda la prueba / por batch) */
.unit-list { display: grid; gap: 8px; }
.unit-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.unit-row .li-main { flex: 1 1 auto; min-width: 0; }
.unit-row .li-main > b { display: block; font-size: 14px; }
.unit-row .li-main > span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.unit-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.unit-chips .chip { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.unit-chips .chip.on { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
.unit-chips .chip b { font-weight: 900; }
.unit-hint { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin: 0 0 12px; }
.unit-hint svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; color: var(--orange); }
.av-list { display: grid; gap: 10px; margin-bottom: 12px; }
.av-row { display: grid; grid-template-columns: minmax(110px, auto) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.av-row span { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.av-row span svg { width: 15px; height: 15px; color: var(--orange); }
.av-bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.av-bar i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
@media (max-width: 600px) {
  .unit-row { flex-wrap: wrap; }
  .unit-row .row-actions { width: 100%; justify-content: flex-end; }
}

/* v4.2 · Encabezados de pasos y prioridad del registro */
.fs-step { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 16px; }
.fs-step:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.fs-num { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #fff; background: linear-gradient(135deg, #F58020, #E8650A); flex: 0 0 auto; box-shadow: 0 4px 10px rgba(245, 128, 32, .28); }
.fs-step b { display: block; font-size: 15px; color: var(--text); }
.fs-step small { display: block; font-size: 12px; color: var(--muted); }
.prio-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
.prio-seg label { position: relative; margin: 0; cursor: pointer; }
.prio-seg input { position: absolute; opacity: 0; pointer-events: none; }
.prio-seg span { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; transition: background .15s, box-shadow .15s; }
.prio-seg .pdot { grid-row: span 2; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; }
.prio-seg b { font-size: 13.5px; color: var(--text); }
.prio-seg small { font-size: 11px; color: var(--muted); }
.prio-seg input:focus-visible + span { box-shadow: 0 0 0 3px rgba(245, 128, 32, .3); }
.prio-seg input:checked + span { background: var(--card); box-shadow: 0 2px 8px rgba(0, 0, 0, .10); }
.prio-seg .prio-normal input:checked + span .pdot { background: var(--ok); border-color: var(--ok); }
.prio-seg .prio-alta input:checked + span .pdot { background: var(--warn); border-color: var(--warn); }
.prio-seg .prio-urgente input:checked + span .pdot { background: var(--bad); border-color: var(--bad); box-shadow: 0 0 0 4px var(--bad-bg); }
.prio-seg .prio-urgente input:checked + span b { color: var(--bad); }
@media (max-width: 520px) {
  .prio-seg span { grid-template-columns: auto 1fr; padding: 8px; }
  .prio-seg small { display: none; }
}

/* v4.2 · Colores de los indicadores del panel */
.kpi.i-green .kpi-ico { background: linear-gradient(135deg, #16A34A, #4ADE80) !important; }
.kpi.i-yellow .kpi-ico { background: linear-gradient(135deg, #EAB308, #FDE047) !important; }
.kpi.i-orange .kpi-ico { background: linear-gradient(135deg, #EA580C, #FB923C) !important; }
.kpi.i-red .kpi-ico { background: linear-gradient(135deg, #DC2626, #F87171) !important; }
.kpi.k-green::before { background: #16A34A; } .kpi.k-yellow::before { background: #EAB308; }
.kpi.k-orange::before { background: #EA580C; } .kpi.k-red::before { background: #DC2626; }

const CONSTRAINT_MSG = {
  areas_prubind_nombre_uk: 'Ya existe un área con ese nombre.',
  usuarios_prubind_email_uk: 'Ese correo ya está registrado.',
  usuarios_prubind_email_check: 'El correo debe ser del dominio @petstable.mx.',
  pruebas_prubind_fechas_ck: 'La fecha de fin debe ser igual o posterior a la de inicio.',
  tipo_responsables_prubind_pkey: 'Esa persona ya es responsable de este tipo de prueba.',
  tipos_prueba_prubind_prefijo_uk: 'Ese prefijo ya lo usa otro tipo de prueba.',
};
function errMsg(err) {
  if (!err) return 'Ocurrió un error inesperado.';
  const msg = err.message || String(err);
  for (const [k, v] of Object.entries(CONSTRAINT_MSG)) if (msg.includes(k) || err.details?.includes?.(k)) return v;
  if (err.code === '23505') return 'El registro ya existe (dato duplicado).';
  if (err.code === '23503') return 'No se puede eliminar porque tiene registros relacionados. Puede desactivarlo en su lugar.';
  if (err.code === '23514') return 'Algún dato no cumple las reglas de validación.';
  if (err.code === '42501') return msg.includes('permission denied') || msg.includes('row-level security') ? 'No tiene permiso para realizar esta acción.' : msg;
  if (err.code === 'P0001') return msg;
  if (/row-level security|permission denied|Unauthorized/i.test(msg)) return 'No tiene permiso para realizar esta acción.';
  if (/exceeded the maximum allowed size|Payload too large/i.test(msg)) return 'El archivo es demasiado grande.';
  if (/mime type|invalid_mime/i.test(msg)) return 'Tipo de archivo no permitido.';
  if (err.code === 'PGRST301' || /JWT expired|invalid JWT/i.test(msg)) return 'Su sesión expiró. Vuelva a iniciar sesión.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) return 'No hay conexión con el servidor. Verifique su red e intente de nuevo.';
  return msg;
}
// Lanza el error de una respuesta de Supabase
function must(res) { if (res.error) throw res.error; return res; }
// Una actualización que no afectó filas (RLS) se reporta como falta de permiso
function mustRow(res) {
  must(res);
  if (Array.isArray(res.data) ? !res.data.length : !res.data) throw Object.assign(new Error('No tiene permiso para modificar este registro o ya no existe.'), { code: '42501' });
  return res;
}

// ---------- Modales ----------
let modalDepth = 0;
function openModal({ title, subtitle = '', body = '', submitText = 'Guardar', onSubmit = null, size = '', danger = false, onOpen = null, confirmDiscard = true }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `
      <form class="modal-box ${size}" role="dialog" aria-modal="true" aria-labelledby="mt-${modalDepth}" novalidate>
        <header class="modal-head">
          <div><h3 id="mt-${modalDepth}">${esc(title)}</h3>${subtitle ? `<p>${esc(subtitle)}</p>` : ''}</div>
          <button type="button" class="icon-btn" data-close aria-label="Cerrar">${icon('x')}</button>
        </header>
        <div class="modal-body">${body}</div>
        <footer class="modal-foot">
          ${onSubmit
            ? `<div class="form-error" role="alert"></div>
               <button type="button" class="btn secondary" data-close>Cancelar</button>
               <button type="submit" class="btn ${danger ? 'danger' : 'primary'}" data-submit>${esc(submitText)}</button>`
            : `<button type="button" class="btn secondary" data-close>Cerrar</button>`}
        </footer>
      </form>`;
    modalDepth++;
    root.appendChild(wrap);
    document.body.classList.add('modal-open');
    const form = wrap.querySelector('form');
    const errBox = wrap.querySelector('.form-error');
    let dirty = false, busy = false, result;
    form.addEventListener('input', () => { dirty = true; });

    const finish = () => {
      wrap.remove(); modalDepth--;
      document.removeEventListener('keydown', onKey);
      if (!root.children.length) document.body.classList.remove('modal-open');
      resolve(result);
    };
    const close = async (force = false) => {
      if (busy) return;
      if (!force && dirty && onSubmit && confirmDiscard) {
        const ok = await confirmDialog({ title: '¿Descartar cambios?', message: 'Hay información capturada que no se ha guardado.', confirmText: 'Descartar', danger: true });
        if (!ok) return;
      }
      finish();
    };
    const onKey = (e) => { if (e.key === 'Escape' && root.lastElementChild === wrap) { e.preventDefault(); close(); } };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });

    const ctx = {
      form, wrap,
      setError: (m) => { if (errBox) errBox.textContent = m || ''; },
      close: (value) => { result = value; finish(); },
    };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!onSubmit || busy) return;
      ctx.setError('');
      const btn = form.querySelector('[data-submit]');
      busy = true; btn.disabled = true;
      const label = btn.innerHTML; btn.innerHTML = `<span class="spinner sm"></span> Guardando…`;
      try {
        const r = await onSubmit(ctx);
        if (r !== false) { result = r === undefined ? true : r; busy = false; finish(); return; }
      } catch (err) {
        console.error(err);
        ctx.setError(errMsg(err));
      }
      busy = false; btn.disabled = false; btn.innerHTML = label; refreshIcons();
    });
    refreshIcons();
    onOpen?.(ctx);
    setTimeout(() => form.querySelector('input:not([type=hidden]):not([disabled]):not([type=checkbox]), select, textarea')?.focus({ preventScroll: true }), 30);
  });
}

// Confirmación (opcionalmente con texto obligatorio, p. ej. motivo de cancelación)
function confirmDialog({ title, message = '', confirmText = 'Confirmar', danger = false, input = null }) {
  const body = `<p style="margin:0 0 6px">${esc(message)}</p>
    ${input ? `<div class="field"><label for="cd-input">${esc(input.label)} ${input.required ? '<span class="req">*</span>' : ''}</label>
      <textarea id="cd-input" name="value" maxlength="${input.maxlength || 300}" ${input.required ? 'required' : ''} placeholder="${esc(input.placeholder || '')}"></textarea></div>` : ''}`;
  return openModal({
    title, body, submitText: confirmText, danger, size: 'sm', confirmDiscard: false,
    onSubmit: ({ form }) => {
      if (input) {
        if (!checkForm(form)) return false;
        return { value: form.elements.value.value.trim() };
      }
      return true;
    },
  }).then((r) => r || false);
}

// ---------- Validación de formularios ----------
function validityMessage(el) {
  const v = el.validity;
  if (v.valueMissing) return 'Campo obligatorio.';
  if (v.typeMismatch) return el.type === 'email' ? 'Correo electrónico inválido.' : 'Formato inválido.';
  if (v.patternMismatch) return el.dataset.patternMsg || 'Formato inválido.';
  if (v.tooShort) return `Mínimo ${el.minLength} caracteres.`;
  if (v.tooLong) return `Máximo ${el.maxLength} caracteres.`;
  if (v.rangeUnderflow) return `El valor mínimo es ${el.min}.`;
  if (v.rangeOverflow) return `El valor máximo es ${el.max}.`;
  if (v.stepMismatch) return el.step === '1' ? 'Use un número entero.' : 'Use como máximo 3 decimales.';
  if (v.badInput) return 'Valor inválido.';
  return 'Valor inválido.';
}
function fieldError(el, msg) {
  const field = el.closest('.field') || el.parentElement;
  field.classList.add('invalid');
  const s = document.createElement('small'); s.className = 'field-error'; s.textContent = msg;
  field.appendChild(s);
}
function clearErrors(form) {
  form.querySelectorAll('.field-error').forEach((e) => e.remove());
  form.querySelectorAll('.invalid').forEach((e) => e.classList.remove('invalid'));
}
function checkForm(form, custom = {}) {
  clearErrors(form);
  let first = null;
  for (const el of form.elements) {
    if (!el.name || el.disabled || el.type === 'button' || el.type === 'submit') continue;
    let msg = '';
    if (el.required && typeof el.value === 'string' && el.type !== 'radio' && el.type !== 'checkbox' && !el.value.trim()) msg = 'Campo obligatorio.';
    else if (el.willValidate && !el.checkValidity()) msg = validityMessage(el);
    if (!msg && custom[el.name]) msg = custom[el.name](el.value, form) || '';
    if (msg && !el.closest('.field')?.classList.contains('invalid')) { fieldError(el, msg); first ??= el; }
  }
  if (first) (first._cs?.btn || first).focus();
  return !first;
}
function formValues(form) {
  const o = {};
  for (const [k, v] of new FormData(form).entries()) o[k] = typeof v === 'string' ? v.trim() : v;
  return o;
}
const nullIfEmpty = (v) => (v === '' || v === undefined ? null : v);
const numOrNull = (v) => (v === '' || v === undefined || v === null ? null : Number(v));

// Contadores de caracteres en textareas con data-counter
function bindCounters(root) {
  root.querySelectorAll('textarea[maxlength][data-counter]').forEach((ta) => {
    const lab = root.querySelector(`label[for="${ta.id}"]`);
    if (!lab) return;
    const c = document.createElement('span'); c.className = 'counter'; lab.appendChild(c);
    const upd = () => { c.textContent = `${ta.value.length}/${ta.maxLength}`; };
    ta.addEventListener('input', upd); upd();

}

// ---------- Tabla con paginación y orden en servidor ----------
class DataTable {
  /**
   * @param {HTMLElement} el contenedor
   * @param {{columns: Array, fetch: Function, pageSize?: number, sort?: {key:string, asc:boolean}, empty?: object, rowKey?: string, rowClass?: Function}} opts
   * columns: [{ key, label, sort?: 'columna', cls?, render(row) }]
   * fetch({ from, to, sort, filters }) => Promise<{ rows, count }>
   */
  constructor(el, opts) {
    this.el = el; this.o = opts;
    this.page = 1; this.size = opts.pageSize || prefsNum('prubind.pagesize', 10);
    this.sort = opts.sort || null; this.filters = {};
    this.rows = []; this.count = 0; this.token = 0;
    el.addEventListener('click', (e) => this.onClick(e));
    el.addEventListener('change', (e) => {
      if (e.target.matches('[data-pagesize]')) { this.size = Number(e.target.value); prefs.set('prubind.pagesize', String(this.size)); this.page = 1; this.load(); }
    });
  }
  setFilters(f) { this.filters = { ...this.filters, ...f }; this.page = 1; return this.load(); }
  row(id) { return this.rows.find((r) => String(r[this.o.rowKey || 'id']) === String(id)); }
  onClick(e) {
    const th = e.target.closest('th[data-sort]');
    if (th) {
      const key = th.dataset.sort;
      this.sort = this.sort?.key === key ? { key, asc: !this.sort.asc } : { key, asc: true };
      this.page = 1; this.load(); return;
    }
    const pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) { this.page = Number(pg.dataset.page); this.load(); return; }
    if (e.target.closest('[data-action="retry"]')) this.load();
  }
  async load() {
    const t = ++this.token;
    const from = (this.page - 1) * this.size, to = from + this.size - 1;
    if (!this.rendered) this.el.innerHTML = this.skeleton();
    else this.el.querySelector('.table-wrap')?.classList.add('table-loading');
    try {
      const { rows, count } = await this.o.fetch({ from, to, sort: this.sort, filters: this.filters });
      if (t !== this.token) return;
      this.rows = rows || []; this.count = count ?? this.rows.length;
      const pages = Math.max(1, Math.ceil(this.count / this.size));
      if (this.page > pages && this.count > 0) { this.page = pages; return this.load(); }
      this.render();
    } catch (err) {
      if (t !== this.token) return;
      console.error(err);
      this.rendered = false;
      this.el.innerHTML = errorState(err);
      refreshIcons();
    }
  }
  skeleton() {
    return `<div class="table-wrap"><table class="table"><tbody>${Array.from({ length: 5 }, () => `<tr>${this.o.columns.map(() => '<td><div class="skeleton"></div></td>').join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  render() {
    const { columns, empty } = this.o;
    if (!this.rows.length) {
      const filtered = Object.entries(this.filters).some(([k, v]) => !(this.o.baseFilters || []).includes(k) && v !== '' && v != null && v !== false);
      this.el.innerHTML = emptyState(filtered
        ? { ico: 'search-x', title: 'Sin resultados', text: 'No hay registros que coincidan con los filtros aplicados.' }
        : (empty || { title: 'Sin registros' }));
      this.rendered = false; refreshIcons(); return;
    }
    const head = columns.map((c) => {
      const sorted = c.sort && this.sort?.key === c.sort;
      const ind = c.sort ? `<span class="sort-ind">${sorted ? (this.sort.asc ? '▲' : '▼') : '↕'}</span>` : '';
      return `<th class="${c.cls || ''} ${c.sort ? 'sortable' : ''} ${sorted ? 'sorted' : ''}" ${c.sort ? `data-sort="${c.sort}" aria-sort="${sorted ? (this.sort.asc ? 'ascending' : 'descending') : 'none'}"` : ''}>${esc(c.label)}${ind}</th>`;
    }).join('');

const etiquetasPlugin = {
  id: 'etiquetas',
  afterDatasetsDraw(chart, _args, opts) {
    if (opts?.display === false) return;
    const { ctx } = chart;
    const text = cssVar('--text') || '#172431';
    const dona = chart.config.type === 'doughnut';
    const horizontal = chart.options.indexAxis === 'y';
    const apilada = !dona && !!(chart.options.scales?.x?.stacked || chart.options.scales?.y?.stacked);
    ctx.save();
    ctx.font = '700 12px Inter, Segoe UI, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden || meta.type === 'line') return;
      const total = dona ? ds.data.reduce((s, v) => s + (Number(v) || 0), 0) : 0;
      meta.data.forEach((el, i) => {
        const v = Number(ds.data[i]);
        if (!v || (dona && !chart.getDataVisibility(i))) return;
        const txt = fmtEtiqueta(v);
        const w = ctx.measureText(txt).width;
        if (dona) {
          if (v / total < 0.05) return;
          const p = el.tooltipPosition();
          ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
          ctx.fillText(txt, p.x, p.y);
        } else if (apilada) {
          const largo = horizontal ? Math.abs(el.x - el.base) : Math.abs(el.base - el.y);
          if (largo < w + 10) return;

          ctx.fillText(txt, p.x, p.y);
        } else if (horizontal) {

          ctx.fillText(txt, el.x + 6, el.y);

function makeChart(canvas, config) {

    [valor]: { display: false, grid: { color: line, drawTicks: false }, ticks: { color: muted, precision: 0 }, beginAtZero: true, stacked: apilada, grace: '14%' },

      layout: { padding: dona ? 6 : { top: horizontal ? 4 : 18, right: horizontal ? 34 : 8 } },
      interaction: { mode: dona ? 'nearest' : 'index', intersect: dona },

        legend: { labels: { color: text, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', padding: 14, font: { weight: 600 } }, ...(config.options?.plugins?.legend || {}) },
        tooltip: { backgroundColor: '#0D1B26', titleColor: '#EEF3F7', bodyColor: '#EEF3F7', padding: 12, cornerRadius: 10, boxPadding: 4, usePointStyle: true,
          callbacks: dona ? { label: (it) => { const t = it.dataset.data.reduce((s, v) => s + (Number(v) || 0), 0); return ` ${it.label}: ${fmtEtiqueta(it.parsed)} (${t ? Math.round((it.parsed / t) * 100) : 0} %)`; } } : {} },
        etiquetas: config.options?.plugins?.etiquetas || {},

// Recorta al centro, reduce a 320×320 y convierte a JPEG antes de subir (fotos ligeras)
async function prepararFoto(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error('La foto debe ser JPG, PNG o WEBP.');
  if (file.size > FOTO_MAX_MB * 1024 * 1024) throw new Error(`La foto no debe superar ${FOTO_MAX_MB} MB.`);
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen.')); i.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight), size = 320;
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('No se pudo procesar la imagen.'))), 'image/jpeg', 0.86));
  } finally { URL.revokeObjectURL(url); }
}

// Elegir de una vez los parámetros sugeridos de un área (desde el expediente)
async function definirForm(P, area) {
  const [metodos, unidades, plantilla] = await Promise.all([getCat('metodos'), getCat('unidades'), plantillaDe(P.tipo)]);
  const base = plantilla.map((pt) => ({ m: metodos.find((x) => x.id === pt.metodo_id), def: pt.obligatorio }))
    .filter((x) => x.m && x.m.activo !== false && x.m.area === area);
  const extra = [];
  const pintar = (form) => {
    const todos = [...base, ...extra.map((m) => ({ m, def: true }))];
    form.querySelector('#df-lista').innerHTML = todos.length ? `<div class="chk-grid">${todos.map(({ m, def }) => `<label class="chk-param"><input type="checkbox" name="m" value="${esc(m.id)}" ${def ? 'checked' : ''}>
      <span>${esc(m.nombre)} <span class="cell-sub">(${esc(medidaTxt(m, unidades))})</span></span></label>`).join('')}</div>` : '<p class="hint">Sin parámetros sugeridos; agregue los que necesite.</p>';
  };
  return openModal({
    title: `Parámetros de ${AREAS[area].label}`, subtitle: `${P.folio} · ${P.cambio}`, size: 'lg', submitText: 'Guardar parámetros',
    body: `<p class="hint">${esc(AREAS[area].desc)}. Marque lo que se medirá en esta prueba.</p><div id="df-lista"></div>
      <button type="button" class="link-btn" data-df="nuevo">${icon('plus')} Agregar otro parámetro</button>`,
    onOpen: ({ form }) => {
      pintar(form); refreshIcons();
      form.addEventListener('click', async (e) => {
        if (!e.target.closest('[data-df="nuevo"]')) return;
        const ya = [...form.querySelectorAll('input[name=m]')].map((i) => i.value);
        const id = await parametroForm({ area, tipo: P.tipo, excluir: ya });
        if (!id) return;
        const m = (await getCat('metodos')).find((x) => x.id === id);
        if (m) { extra.push(m); pintar(form); }
      });
    },
    onSubmit: async ({ form, setError }) => {
      const ids = [...form.querySelectorAll('input[name=m]:checked')].map((i) => i.value);
      if (!ids.length) { setError('Marque al menos un parámetro.'); return false; }
      return ids;
    },
  });
}
