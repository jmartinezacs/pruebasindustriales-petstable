        <div class="area-list ${involucrada ? '' : 'hidden'}">
          <p class="hint area-nota">${icon('user-check')} Usted define los parámetros de ${esc(A.label)}.</p>
          ${proceso.length ? `${compl.length ? '<div class="sub-title">Durante el proceso</div>' : ''}<div class="chk-grid">${proceso.map((x) => fila(x.m, x.def)).join('')}</div>` : ''}
          ${compl.length ? `<div class="sub-title">Evaluaciones complementarias ${ayuda('Evaluación sensorial, microbiología y análisis bromatológicos.')}</div>
            <div class="chk-grid">${compl.map((x) => fila(x.m, x.def)).join('')}</div>` : ''}
          ${!base.length ? '<p class="hint">Sin parámetros sugeridos para este tipo de prueba.</p>' : ''}
          <button type="button" class="link-btn" data-add="${area}">${icon('plus')} Agregar parámetro de ${esc(A.label)}</button>
        </div></div>`;
    }).join('');
    refreshIcons();
  };

  const cargar = async () => {
    const t = getTipo();
    if (!t) { cont.innerHTML = '<p class="hint">Elija el tipo de prueba para ver los parámetros.</p>'; tipo = null; return; }
    if (t === tipo) return;
    tipo = t; marcados.clear(); Object.keys(extra).forEach((k) => delete extra[k]);
    cont.innerHTML = '<div class="skeleton" style="height:120px"></div>';
    try {
      [metodos, unidades, plantilla] = await Promise.all([getCat('metodos'), getCat('unidades'), plantillaDe(t)]);
      pintar();
    } catch (err) { cont.innerHTML = aviso(errMsg(err), 'bad', 'alert-triangle'); }
  };

  cont.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-toggle]')) { if (t.checked) activas.add(t.dataset.toggle); else activas.delete(t.dataset.toggle); pintar(); return; }
    if (t.matches('.chk-param input')) marcados.set(t.value, t.checked);
  });
  cont.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-add]');
    if (!b) return;
    e.preventDefault();
    const area = b.dataset.add;
    const ya = [...cont.querySelectorAll('.chk-param input')].map((i) => i.value);
    try {
      const id = await parametroForm({ area, tipo, excluir: ya });
      if (!id) return;
      metodos = await getCat('metodos');
      (extra[area] ||= []).push(id); marcados.set(id, true);
      pintar();
    } catch (err) { toast(errMsg(err), 'error'); }
  });

  cargar();
  return {
    recargar: cargar,
    leer: () => {
      const ids = [];
      cont.querySelectorAll('.area-block.propia').forEach((blk) => {
        if (blk.querySelector('.area-list')?.classList.contains('hidden')) return;
        ids.push(...[...blk.querySelectorAll('.chk-param input:checked')].map((i) => i.value));
      });
      return { ids, involucradas: [...AREAS_ORDEN] };
    },
  };
}

// ---------- Tarjeta de parámetros en el expediente ----------
// Cada área agrega o quita los suyos; quien registra indica si se involucra
// Seguridad o Mantenimiento (no detienen la prueba si no registran su parte).
async function montarParametrosPrueba(el, P, recargar) {
  const [metodos, unidades, plan, pars, conRes, sinPar] = await Promise.all([
    getCat('metodos'), getCat('unidades'),
    sb.from('plan_evaluacion_prubind').select('*').eq('prueba_id', P.id).eq('incluido', true).order('orden'),
    sb.from('prueba_parametros_prubind').select('*').eq('prueba_id', P.id).order('orden'),
    sb.from('resultados_prubind').select('plan_id').eq('prueba_id', P.id),
    sb.from('areas_sin_parametros_prubind').select('area, motivo, created_at, por:usuarios_prubind!areas_sin_parametros_prubind_declarado_por_fkey(nombre)').eq('prueba_id', P.id),
  ]);
  [plan, pars, conRes, sinPar].forEach((r) => { if (r.error) throw r.error; });
  const declarada = (a) => sinPar.data.find((s) => s.area === a);
  const usados = new Set(conRes.data.map((r) => r.plan_id));
  const met = (id) => metodos.find((m) => m.id === id);
  const abierta = ABIERTA.includes(P.estado);
  const editaArea = (area) => abierta && puedeArea(P, 'evaluar', area);
  const registra = abierta && puedeEn(P, 'preparar');
  const porArea = {};
  plan.data.forEach((pl) => { const m = met(pl.metodo_id); if (m) (porArea[m.area] ||= []).push({ pl, m }); });
  const involucradas = new Set([...(P.areas_involucradas || ['calidad', 'produccion']), ...Object.keys(porArea), ...(pars.data.length ? ['produccion'] : [])]);
  const areas = AREAS_ORDEN.filter((a) => involucradas.has(a));
  const sumables = [];
  const crit = (pl, m) => criterioTxt(pl, unidadTxt(unidades, m.unidad_id));
  const item = ({ pl, m }, area) => `<li><span>${esc(m.nombre)} <span class="cell-sub">· ${esc(medidaTxt(m, unidades))}${crit(pl, m) ? ` · criterio ${esc(crit(pl, m))}` : ''}</span></span>
    ${editaArea(area) && !usados.has(pl.id) ? iconBtn(`data-par="quitar" data-id="${esc(pl.id)}" data-nom="${esc(m.nombre)}"`, 'x', 'Quitar parámetro', 'bad') : ''}</li>`;
  el.innerHTML = `<div class="card mt">${cardHead('Parámetros a evaluar', 'Cada área define los parámetros que le corresponden o indica que no tiene nada que evaluar. También se pueden agregar durante la prueba.')}
    <div class="areas-grid">${areas.map((area) => {
      const xs = porArea[area] || [], proc = xs.filter((x) => !esCompl(x.m)), compl = xs.filter((x) => esCompl(x.m));
      const sinDefinir = !xs.length && !(area === 'produccion' && pars.data.length);
      const dec = declarada(area);
      if (dec) {
        return `<div class="area-block area-na"><div class="area-head">${icon(AREAS[area].ico)}<div><b>${esc(AREAS[area].label)}</b><span>${esc(AREAS[area].desc)}</span></div>
            <span class="area-tag na">${icon('circle-slash')} Sin nada que evaluar</span></div>
          <p class="hint area-nota">${esc(dec.por?.nombre || 'El responsable')} indicó que su área no tiene nada que evaluar en esta prueba${dec.motivo ? `: “${esc(dec.motivo)}”` : '.'}</p>
          <div class="area-acts">${editaArea(area) ? `<button type="button" class="link-btn" data-par="retomar" data-area="${area}">${icon('rotate-ccw')} Sí hay algo que evaluar</button>` : ''}</div></div>`;
      }
      return `<div class="area-block ${sinDefinir ? 'pendiente' : ''}"><div class="area-head">${icon(AREAS[area].ico)}<div><b>${esc(AREAS[area].label)}</b><span>${esc(AREAS[area].desc)}</span></div>
          ${sinDefinir ? `<span class="area-tag wait">${icon('hourglass')} Por definir</span>` : `<span class="area-tag ok">${xs.length + (area === 'produccion' ? pars.data.length : 0)} parámetro(s)</span>`}</div>
        ${sinDefinir ? `<p class="hint area-nota">${editaArea(area) ? 'Defina los parámetros de su área o indique que no tiene nada que evaluar.' : `${esc(AREAS[area].label)} aún no define sus parámetros. Si no registra nada durante la prueba, se considera que no requirió participar.`}</p>` : ''}
        ${proc.length ? `<ul class="param-list">${proc.map((x) => item(x, area)).join('')}</ul>` : ''}
        ${compl.length ? `<div class="sub-title">Evaluaciones complementarias</div><ul class="param-list">${compl.map((x) => item(x, area)).join('')}</ul>` : ''}
        ${area === 'produccion' && pars.data.length ? `<div class="sub-title">Parámetros del equipo (${esc(P.equipo_nombre || 'equipo')})</div><ul class="param-list">${pars.data.map((x) =>
          `<li><span>${esc(x.nombre)} <span class="cell-sub">· ${esc(x.minimo != null || x.maximo != null ? criterioTxt({ crit_minimo: x.minimo, crit_maximo: x.maximo }, unidadTxt(unidades, x.unidad_id)) : (x.referencia || '').split(' · ')[0] || 'referencia del equipo')}</span></span></li>`).join('')}</ul>` : ''}
        <div class="area-acts">${editaArea(area) ? `<button type="button" class="${sinDefinir ? 'btn primary sm' : 'link-btn'}" data-par="${sinDefinir ? 'definir' : 'agregar'}" data-area="${area}">${icon(sinDefinir ? 'list-checks' : 'plus')} ${sinDefinir ? 'Definir parámetros' : 'Agregar parámetro'}</button>
          ${!xs.some((x) => usados.has(x.pl.id)) && !(area === 'produccion' && pars.data.length) ? `<button type="button" class="btn ghost sm" data-par="nada" data-area="${area}">${icon('circle-slash')} Nada que evaluar por mi área</button>` : ''}` : ''}</div></div>`;
    }).join('')}</div>
    ${sumables.length ? `<p class="hint mt-s">¿La prueba involucra otra área? ${sumables.map((a) => `<button type="button" class="link-btn" data-par="incluir" data-area="${a}">${icon('plus')} ${esc(AREAS[a].label)}</button>`).join(' ')}</p>` : ''}
  </div>`;
  refreshIcons();
  el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-par]');
    if (!b) return;
    const area = b.dataset.area;
    try {
      switch (b.dataset.par) {
        case 'definir': {
          const ids = await definirForm(P, area);
          if (!ids) return;
          must(await sb.rpc('prubind_definir_parametros', { p_prueba: P.id, p_agregar: ids, p_quitar: [] }));
          toast(`Parámetros de ${AREAS[area].label} definidos.`, 'success'); break;
        }
        case 'agregar': {
          const id = await parametroForm({ area, tipo: P.tipo, excluir: plan.data.map((pl) => pl.metodo_id) });
          if (!id) return;
          must(await sb.rpc('prubind_definir_parametros', { p_prueba: P.id, p_agregar: [id], p_quitar: [] }));
          toast('Parámetro agregado a la prueba.', 'success'); break;
        }
        case 'quitar':
          if (!await confirmDialog({ title: 'Quitar parámetro', message: `"${b.dataset.nom}" ya no se evaluará en esta prueba.`, confirmText: 'Quitar' })) return;
          must(await sb.rpc('prubind_definir_parametros', { p_prueba: P.id, p_agregar: [], p_quitar: [b.dataset.id] }));
          toast('Parámetro quitado.', 'success'); break;
        case 'nada': {
          const r = await confirmDialog({ title: `${AREAS[area].label}: nada que evaluar`, message: `${AREAS[area].label} no participará en esta prueba${(porArea[area] || []).length ? ' y se quitarán los parámetros que había definido' : ''}. Si cambia de opinión, puede retomarla mientras la prueba no termine.`,
            confirmText: 'Confirmar', input: { label: 'Motivo (opcional)', maxlength: 300, placeholder: 'Ej. El cambio no afecta al área' } });
          if (!r) return;
          must(await sb.rpc('prubind_area_sin_parametros', { p_prueba: P.id, p_area: area, p_motivo: r.value || null, p_quitar: false }));
          toast(`${AREAS[area].label} quedó sin nada que evaluar en esta prueba.`, 'success'); break;
        }
        case 'retomar':
          must(await sb.rpc('prubind_area_sin_parametros', { p_prueba: P.id, p_area: area, p_motivo: null, p_quitar: true }));
          toast(`${AREAS[area].label} vuelve a participar: defina sus parámetros.`, 'success'); break;
        case 'incluir': case 'excluir': {
          const nuevas = [...involucradas].filter((a) => a !== area || b.dataset.par === 'incluir');
          if (b.dataset.par === 'incluir') nuevas.push(area);
          must(await sb.rpc('prubind_areas_involucradas', { p_prueba: P.id, p_areas: nuevas }));
          if (b.dataset.par === 'incluir' && editaArea(area)) { recargar(); return; }
          toast(b.dataset.par === 'incluir' ? `${AREAS[area].label} quedó involucrada en la prueba.` : `${AREAS[area].label} ya no participa en la prueba.`, 'success'); break;
        }
        default: return;
      }
      recargar();
    } catch (err) { toast(errMsg(err), 'error'); }
  });
}

// Elegir de una vez los parámetros sugeridos de un área (desde el expediente)
async function definirForm(P, area) {
  const [metodos, unidades, plantilla] = await Promise.all([getCat('metodos'), getCat('unidades'), plantillaDe(P.tipo)]);
  const base = plantilla.map((pt) => ({ m: metodos.find((x) => x.id === pt.metodo_id), def: pt.obligatorio }))
    .filter((x) => x.m && x.m.activo !== false && x.m.area === area);
  const extra = [];
  const pintar = (form) => {
    const todos = [...base, ...extra.map((m) => ({ m, def: true }))];
    form.querySelector('#df-lista').innerHTML = todos.length ? `<div class="chk-grid">${todos.map(({ m, def }) => `<label class="chk-param"><input type="checkbox" name="m" value="${esc(m.id)}" ${def ? 'checked' : ''}>
      <span>${esc(m.nombre)} <span class="cell-sub">(${esc(medidaTxt(m, unidades))})</span></span></label>`).join('')}</div>` : '<p class="hint">Sin parámetros sugeridos; agregue los que necesite.</p>';
  };
  return openModal({
    title: `Parámetros de ${AREAS[area].label}`, subtitle: `${P.folio} · ${P.cambio}`, size: 'lg', submitText: 'Guardar parámetros',
    body: `<p class="hint">${esc(AREAS[area].desc)}. Marque lo que se medirá en esta prueba.</p><div id="df-lista"></div>
      <button type="button" class="link-btn" data-df="nuevo">${icon('plus')} Agregar otro parámetro</button>`,
    onOpen: ({ form }) => {
      pintar(form); refreshIcons();
      form.addEventListener('click', async (e) => {
        if (!e.target.closest('[data-df="nuevo"]')) return;
        const ya = [...form.querySelectorAll('input[name=m]')].map((i) => i.value);
        const id = await parametroForm({ area, tipo: P.tipo, excluir: ya });
        if (!id) return;
        const m = (await getCat('metodos')).find((x) => x.id === id);
        if (m) { extra.push(m); pintar(form); }
      });
    },
    onSubmit: async ({ form, setError }) => {
      const ids = [...form.querySelectorAll('input[name=m]:checked')].map((i) => i.value);
      if (!ids.length) { setError('Marque al menos un parámetro.'); return false; }
      return ids;
    },
  });
}

// ---------- Formulación de la prueba (nuevo producto y cambio en la formulación) ----------
const ACC_FORM = { sin_cambio: ['Sin cambio', 'gray'], modificar: ['Modificada', 'info'], agregar: ['Nueva', 'ok'], retirar: ['Se quita', 'bad'], sustituir: ['Sustituye', 'orange'] };
const copiada = new Set(); // la receta se copia sola una vez por prueba en la sesión

async function montarFormulacion(el, P, recargar) {
  if (!(P.secciones_prep || []).includes('formulacion')) { el.innerHTML = ''; return; }
  const editable = ['registrada', 'en_preparacion'].includes(P.estado) && puedeEn(P, 'preparar');
  const [materias, unidades, res] = await Promise.all([getCat('materias'), getCat('unidades'),
    sb.from('prueba_formulacion_prubind').select('*').eq('prueba_id', P.id).order('orden')]);
  if (res.error) throw res.error;
  const F = res.data;
  if (editable && !F.length && P.receta_version_id && !copiada.has(P.id)) {
    copiada.add(P.id);
    try { await accion(P.id, 'copiar_receta'); recargar(); return; } catch (err) { toast(errMsg(err), 'error'); }
  }
  const mp = (id) => materias.find((m) => m.id === id)?.nombre || '—';
  const un = (id) => unidadTxt(unidades, id);
  el.innerHTML = `<div class="card mt">
    ${cardHead('Formulación de la prueba', P.receta_nombre ? `Basada en <b>${esc(P.receta_nombre)}</b>. Cambie cantidades, agregue o quite materias primas. La receta oficial no se modifica.` : 'Materias primas y cantidades por batch de la receta nueva.',
      editable ? `${btn('data-fo="nuevo"', 'plus', 'Agregar materia prima')}${P.receta_version_id && F.length ? btn('data-fo="copiar"', 'rotate-ccw', 'Restablecer receta original', 'ghost') : ''}` : '')}
    ${F.length ? `<div class="table-wrap responsive"><table class="table"><thead><tr><th>Materia prima</th><th>Receta original</th><th>Prueba (por batch)</th><th>Cambio</th><th class="actions"></th></tr></thead><tbody>

        <td data-label="Materia prima"><div class="td-in"><div class="cell-main">${esc(mp(f.materia_prima_id))}</div>${f.sustituye_a_id ? `<div class="cell-sub">Sustituye a ${esc(mp(f.sustituye_a_id))}</div>` : ''}</div></td>
        <td data-label="Original"><div class="td-in">${f.cantidad_original != null ? esc(fmtQty(f.cantidad_original, un(f.unidad_id))) : '<span class="cell-sub">—</span>'}</div></td>
        <td data-label="Prueba"><div class="td-in">${editable ? `<input class="inline-num" type="number" min="0" step="any" inputmode="decimal" value="${esc(f.cantidad_propuesta ?? '')}" data-prop="${esc(f.id)}" aria-label="Cantidad en la prueba"> ${esc(un(f.unidad_id))}` : esc(fmtQty(f.cantidad_propuesta, un(f.unidad_id)))}</div></td>
        <td data-label="Cambio"><div class="td-in">${pill(...ACC_FORM[f.accion])}</div></td>
        <td class="actions" data-label=""><div class="td-in">${editable && f.accion !== 'retirar' ? iconBtn(`data-fo="quitar" data-id="${esc(f.id)}"`, 'minus-circle', f.cantidad_original != null ? 'Quitar de la prueba' : 'Eliminar', 'bad') : ''}</div></td></tr>`).join('')}
    </tbody></table></div>
    <p class="hint mt-s">Total por batch: <b>${esc(fmtQty(Math.round(F.reduce((s, f) => s + (un(f.unidad_id) === 'kg' ? Number(f.cantidad_propuesta || 0) : 0), 0) * 1000) / 1000, 'kg'))}</b>.${editable ? ` Para quitar una materia prima use ${icon('minus-circle')} o escriba 0.` : ''}</p>`
      : vacio(editable ? 'Agregue las materias primas de la receta.' : 'Sin formulación registrada.')}
    ${!editable && ['registrada', 'en_preparacion'].includes(P.estado) ? '' : !editable ? '<p class="hint">La formulación se ajusta antes de iniciar la prueba.</p>' : ''}
  </div>`;
  refreshIcons();
  el.addEventListener('change', async (e) => {
    const t = e.target.closest('[data-prop]');
    if (!t) return;
    try { mustRow(await sb.from('prueba_formulacion_prubind').update({ cantidad_propuesta: numOrNull(t.value) ?? 0 }).eq('id', t.dataset.prop).select('id')); recargar(); }
    catch (err) { toast(errMsg(err), 'error'); recargar(); }
  });
  el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-fo]');
    if (!b) return;
    try {
      if (b.dataset.fo === 'nuevo') { if (!await ingredienteForm(P, materias, unidades, F)) return; }
      else if (b.dataset.fo === 'copiar') {
        if (!await confirmDialog({ title: 'Restablecer receta original', message: 'Se perderán los cambios hechos a la formulación de esta prueba.', confirmText: 'Restablecer', danger: true })) return;
        await accion(P.id, 'copiar_receta');
      } else if (b.dataset.fo === 'quitar') {
        const f = F.find((x) => x.id === b.dataset.id);
        if (f?.cantidad_original != null) mustRow(await sb.from('prueba_formulacion_prubind').update({ cantidad_propuesta: 0 }).eq('id', f.id).select('id'));
        else mustRow(await sb.from('prueba_formulacion_prubind').delete().eq('id', b.dataset.id).select('id'));
      } else return;
      recargar();
    } catch (err) { toast(errMsg(err), 'error'); }
  });
}

function ingredienteForm(P, materias, unidades, existentes = []) {
  const ya = new Set(existentes.map((x) => x.materia_prima_id));
  return openModal({
    title: 'Agregar materia prima', subtitle: P.folio, size: 'sm',
    body: `<div class="field"><label for="if-mp">Materia prima <span class="req">*</span></label><select id="if-mp" name="mp" required>${opciones(materias.filter((m) => m.activo && !ya.has(m.id)), null)}</select></div>
      <div class="form-grid"><div class="field"><label for="if-c">Cantidad por batch <span class="req">*</span></label><input id="if-c" name="cant" type="number" min="0.0001" step="any" inputmode="decimal" required></div>
      <div class="field"><label for="if-u">Unidad <span class="req">*</span></label><select id="if-u" name="un" required>${opciones(unidades, unidades.find((u) => u.simbolo === 'kg')?.id, { label: (u) => u.simbolo, vacio: null })}</select></div></div>
      <div class="field"><label for="if-s">¿Reemplaza a otra materia prima? ${ayuda('Elija la materia prima de la receta que esta sustituye. Déjelo vacío si solo se agrega.')}</label><select id="if-s" name="sus">${opciones(materias.filter((m) => ya.has(m.id)), null, { vacio: 'No, solo se agrega' })}</select></div>`,
    onOpen: ({ form }) => form.elements.mp.addEventListener('change', () => {
      const m = materias.find((x) => x.id === form.elements.mp.value);

    }),
    onSubmit: async ({ form }) => {
      if (!checkForm(form)) return false;
      const v = formValues(form);
      must(await sb.from('prueba_formulacion_prubind').insert({ prueba_id: P.id, materia_prima_id: v.mp, cantidad_propuesta: Number(v.cant), unidad_id: v.un,
        accion: v.sus ? 'sustituir' : 'agregar', sustituye_a_id: nullIfEmpty(v.sus) }));

      toast('Materia prima agregada.', 'success');
    },
  });
}

async function etapaRecomendaciones(pane, ctx) {
  const { P } = ctx;
  const K = await consolidarResultados(P);
  const enEval = EVALUA.includes(P.estado);
  const part = K.areas.filter((a) => K.participa(a));
  const noPart = AREAS_ORDEN.filter((a) => !part.includes(a));
  const listo = (a) => K.faltan(a) === 0 && K.REC.some((r) => r.area === a);
  const completo = part.length > 0 && part.every(listo);

  const tarjeta = (a) => {
    const r = K.REC.find((x) => x.area === a); const falta = K.faltan(a);
    const fs = K.filas.filter((f) => f.area === a);
    const nc = fs.filter((f) => f.ev?.evaluacion === 'no_cumple');
    const puede = enEval && puedeArea(P, 'evaluar', a);
    const resumen = `<div class="ver-sum">${resumenEval(fs)}${nc.length ? `<span class="bad-txt">No cumple: ${nc.map((f) => esc(f.nombre)).join(', ')}</span>` : ''}</div>`;

        <div class="verdict-opts">${ops.map((k) => { const [l, cls, ic, d] = VEREDICTO[k];
          return `<label class="verdict ${cls}"><input type="radio" name="sentido" value="${k}" ${r?.sentido === k ? 'checked' : ''}><span class="vd-ico">${icon(ic)}</span><span class="vd-txt"><b>${esc(l)}</b><small>${esc(d)}</small></span></label>`; }).join('')}</div>
        <div class="field"><label for="rec-${a}">Recomendaciones y acciones derivadas <span class="req">*</span></label>
          <textarea id="rec-${a}" name="texto" rows="3" maxlength="1000" data-counter placeholder="Qué recomienda el área de acuerdo con los resultados obtenidos">${esc(r?.recomendacion || '')}</textarea></div>
        <div class="form-foot"><div class="form-error" role="alert"></div><button type="submit" class="btn primary">${icon('save')} ${r ? 'Actualizar' : 'Guardar'} veredicto</button></div></form>`;
    } else if (r) {
      const [l, cls, ic] = VEREDICTO[r.sentido];
      cuerpo = `<div class="verdict-done ${cls}"><span class="vd-ico">${icon(ic)}</span><div><b>${esc(l)}</b><span>${esc(r.por?.nombre || '')} · ${fmtDateTime(r.updated_at)}</span></div></div><p class="pre">${esc(r.recomendacion)}</p>`;
    } else if (falta) {
      cuerpo = aviso(`Primero se evalúan los resultados del área (${falta} por evaluar).`, '', 'list-checks');
    } else cuerpo = vacio(`Pendiente: lo registra el responsable de ${AREAS[a].label}.`);
    return `<div class="card mt g-${a}"><div class="card-head"><div class="ae-title"><span class="ar-ico">${icon(AREAS[a].ico)}</span><div><h3>${esc(AREAS[a].label)}</h3><p>${esc(AREAS[a].desc)}</p></div></div>
      ${r ? pill(VEREDICTO[r.sentido][0], VEREDICTO[r.sentido][1]) : pill('Pendiente', 'warn')}</div>${resumen}${cuerpo}</div>`;
  };

  pane.innerHTML = `${['registrada', 'en_preparacion', 'preparada'].includes(P.estado) ? aviso('El veredicto de cada área se registra cuando el área ya evaluó sus resultados.', '', 'circle-play') : ''}
    <div class="grid grid-main">
      <div>${part.map(tarjeta).join('') || `<div class="card">${vacio('Ninguna área ha registrado datos todavía.')}</div>`}
        ${noPart.length ? `<div class="card mt no-part"><div class="card-head"><div>${P.estado === 'en_ejecucion' ? '<h3>Áreas sin datos todavía</h3><p>Participan si registran algún dato durante la prueba.</p>'
          : '<h3>Áreas que no participaron</h3><p>No registraron datos en la prueba: se considera que no requirieron participar.</p>'}</div></div>
          <div class="chips">${noPart.map((a) => `<span class="chip">${icon(AREAS[a].ico)} ${esc(AREAS[a].label)}</span>`).join('')}</div></div>` : ''}</div>
      <div class="card"><div class="card-head"><div><h3>Para pasar a dictamen</h3><p>${P.estado === 'en_ejecucion' ? 'Cuando la prueba termine y todas las áreas que participaron den su veredicto, pasa sola al dictamen de Alta Dirección.' : 'Cuando todas las áreas que participaron dan su veredicto, la prueba pasa sola al dictamen de Alta Dirección.'}</p></div></div>
        ${checklist([...(P.estado === 'en_ejecucion' ? [[false, 'Prueba terminada']] : []), ...part.map((a) => [listo(a), `Veredicto de ${AREAS[a].label}`])])}
        ${TERMINADA.includes(P.estado) && completo ? `<button class="btn primary block mt" data-rc="enviar">${icon('send')} Enviar a dictamen</button>` : ''}
      </div>
    </div>`;
  refreshIcons();

  const enviar = async (auto) => {
    await accion(P.id, 'enviar_dictamen');
    toast(auto ? 'Todas las áreas que participaron dieron su veredicto: la prueba pasó al dictamen de Alta Dirección.' : 'Prueba enviada a dictamen.', 'success');
    ctx.refrescar('dictamen');
  };
  pane.addEventListener('click', async (e) => {
    if (!e.target.closest('[data-rc="enviar"]')) return;
    try { await enviar(false); } catch (err) { toast(errMsg(err), 'error'); }
  });
  pane.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target; const area = form.dataset.area; const err = form.querySelector('.form-error');
    const sentido = form.querySelector('input[name=sentido]:checked')?.value; const texto = form.elements.texto.value.trim();

    const btnG = form.querySelector('button[type=submit]'); btnG.disabled = true;
    try {
      const r = K.REC.find((x) => x.area === area);
      if (r) mustRow(await sb.from('recomendaciones_prubind').update({ sentido, recomendacion: texto }).eq('id', r.id).select('id'));
      else must(await sb.from('recomendaciones_prubind').insert({ prueba_id: P.id, area, sentido, recomendacion: texto, emitido_por: state.profile.id }));
      toast(`Veredicto de ${AREAS[area].label} guardado.`, 'success');
      // Si la prueba ya terminó y están todas, pasa sola al dictamen
      if (TERMINADA.includes(P.estado)) {
        const { data } = must(await sb.rpc('prubind_eval_estado', { p_prueba: P.id }));
        if (data.eval_faltantes === 0 && data.recom_faltantes === 0) { try { await enviar(true); return; } catch { /* se puede enviar manualmente */ } }
      }
      ctx.refrescar('recomendaciones');
    } catch (ex) { err.textContent = errMsg(ex); btnG.disabled = false; }
  });
}

      try {
        const { data } = must(await consulta(filtros(), 'folio, tipo_nombre, cambio, receta_nombre, materia_prima_nombre, proveedor_nombre, equipo_nombre, prioridad, area_nombre, registrado_por_nombre, responsable_ejecucion_nombre, estado, ejecucion_actual, created_at, cerrada_at', false).order('created_at', { ascending: false }).limit(5000));
        exportarCSV(data);
      } catch (err) { toast(errMsg(err), 'error'); }
      return;
    }
    const tr = e.target.closest('tr.row-link');
    if (tr && !e.target.closest('a,button')) navigate(`#/pruebas?id=${tr.dataset.id}`);
  });
  await apply();
}

function etapasMini(p) {
  const et = etapasDe(p.tipo);
  const cur = etapaDe(p.estado, { eval_faltantes: 1 });
  const n = cur === 'fin' ? et.length : et.findIndex(([k]) => k === cur);
  return `<div class="etapas-mini" title="${esc(ESTADOS_PRUEBA[p.estado]?.label)}">${et.map((_, i) => `<span class="${i < n ? 'done' : i === n ? 'cur' : ''} ${p.estado === 'cancelada' ? 'off' : ''}"></span>`).join('')}</div>`;
}

function exportarCSV(rows) {
  const cols = [['folio', 'Folio'], ['tipo_nombre', 'Tipo'], ['cambio', 'Cambio'], ['receta_nombre', 'Receta'], ['materia_prima_nombre', 'Materia prima'], ['proveedor_nombre', 'Proveedor'],
    ['equipo_nombre', 'Equipo'], ['prioridad', 'Prioridad'], ['area_nombre', 'Área'], ['registrado_por_nombre', 'Registró'], ['responsable_ejecucion_nombre', 'Responsable de ejecución'],
    ['estado', 'Estado'], ['ejecucion_actual', 'Ejecución'], ['created_at', 'Registrada'], ['cerrada_at', 'Cerrada']];
  const cel = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const out = '﻿' + [cols.map(([, l]) => cel(l)).join(','), ...rows.map((r) => cols.map(([k]) => cel(k === 'estado' ? ESTADOS_PRUEBA[r[k]]?.label : k.endsWith('_at') ? fmtDateTime(r[k]) : r[k])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/csv;charset=utf-8' }));
  a.download = `pruebas-industriales-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${rows.length} prueba(s) exportadas.`, 'success');
}

// ============================== ETAPA 1 · REGISTRO ==============================
// Datos de la prueba (folio, fecha, hora y quién registra se asignan solos),
// prioridad y los parámetros del área de quien registra.
// Devuelve el id creado, true al editar o false si se cancela
const EJEMPLO_CAMBIO = {
  producto_nuevo: 'Ej. Receta nueva de pavo con arroz',
  cambio_formulacion: 'Ej. Reducir 10 % el filete de pollo y aumentar el recorte',
  cambio_proveedor: 'Ej. Harina de arroz del proveedor alterno',
  material_empaque: 'Ej. Film Chicken Chase formato 4x2',
  cambio_proceso: 'Ej. Aumentar el tiempo de cocción 5 minutos',
};
const PRIO = {
  normal: ['Normal'],
  alta: ['Alta'],
  urgente: ['Urgente'],
};
// Catálogos que se pueden ampliar desde el propio menú
const ALTA = {
  receta_version_id: { tipo: 'receta', cat: 'versiones', opcion: 'Agregar receta nueva…', campo: 'Nombre de la receta', listo: 'Receta agregada.' },
  materia_prima_id: { tipo: 'materia_prima', cat: 'materias', opcion: 'Agregar materia prima nueva…', campo: 'Nombre de la materia prima', listo: 'Materia prima agregada.' },
  proveedor_id: { tipo: 'proveedor', cat: 'proveedores', opcion: 'Agregar proveedor nuevo…', campo: 'Nombre del proveedor', listo: 'Proveedor agregado.' },
};
const NUEVO = '__nuevo__';
// Encabezado de cada bloque del formulario
const paso = (n, titulo, sub, extra = '') => `<div class="fs-step full"><span class="fs-num">${n}</span><div><b>${esc(titulo)}</b><small>${esc(sub)}</small></div>${extra}</div>`;
const esOtro = (o) => /^otro\b/i.test(o?.nombre || '');

async function openRegistro(p = null) {
  let c;
  try {
    const [tipos, versiones, materias, proveedores, objetivos] = await Promise.all(['tipos', 'versiones', 'materias', 'proveedores', 'objetivos'].map((n) => getCat(n)));
    c = { tipos, versiones, materias, proveedores, objetivos };
  } catch (err) { toast(errMsg(err), 'error'); return false; }
  const tiposAct = c.tipos.filter((t) => t.activo || t.codigo === p?.tipo);
  const recetasDe = (vs) => vs.filter((v) => v.estado === 'vigente' || v.id === p?.receta_version_id).sort((a, b) => (a.receta?.nombre || '').localeCompare(b.receta?.nombre || ''));
  const optsDe = {
    receta_version_id: (sel) => opciones(recetasDe(c.versiones), sel, { label: (v) => v.receta?.nombre || '—', vacio: 'Selecciona…' }),
    materia_prima_id: (sel) => opciones(c.materias.filter((m) => m.activo !== false || m.id === sel), sel),
    proveedor_id: (sel) => opciones(c.proveedores.filter((m) => m.activo !== false || m.id === sel), sel, { vacio: 'Sin proveedor' }),
  };
  const conNuevo = (campo, sel) => `${optsDe[campo](sel)}<option value="${NUEVO}">➕ ${ALTA[campo].opcion}</option>`;
  const objetivosDe = (tipo, sel) => {
    const xs = c.objetivos.filter((o) => (o.activo && (!o.tipo || o.tipo === tipo)) || o.id === sel)
      .sort((a, b) => Number(esOtro(a)) - Number(esOtro(b)) || (a.orden ?? 0) - (b.orden ?? 0));
    return opciones(xs, sel, { vacio: 'Selecciona el objetivo…' });
  };
  const ahora = new Intl.DateTimeFormat('es-MX', { dateStyle: 'long', timeStyle: 'short', timeZone: 'America/Mexico_City' }).format(new Date());
  let selector = null;
  return openModal({
    title: p ? `Editar registro ${p.folio}` : 'Nueva prueba industrial', size: 'lg', submitText: p ? 'Guardar cambios' : 'Registrar prueba',
    subtitle: p ? p.tipo_nombre : `Registra ${state.profile.nombre} · ${ahora.replace(/\.$/, '')}. El folio, la fecha y la hora se asignan al guardar.`,
    body: `<div class="form-grid">
        ${paso(1, 'Datos de la prueba', 'Qué se va a probar y para qué')}
        <div class="field full"><label for="rg-tipo">Tipo de prueba <span class="req">*</span></label>
          <select id="rg-tipo" name="tipo" required ${p ? 'disabled' : ''}>${opciones(tiposAct, p?.tipo, { value: (t) => t.codigo })}</select><small class="hint" id="rg-desc"></small></div>
        <div class="field full"><label for="rg-cam">Nombre de la prueba <span class="req">*</span> ${ayuda('Qué se va a probar, en pocas palabras.')}</label>
          <input id="rg-cam" name="cambio" required minlength="3" maxlength="500" value="${esc(p?.cambio || '')}"></div>
        <div class="field full"><label for="rg-obj">Objetivo <span class="req">*</span> ${ayuda('Qué se desea evaluar con la prueba. El catálogo de objetivos se administra en Catálogos.')}</label>
          <select id="rg-obj" name="objetivo_id" required>${objetivosDe(p?.tipo, p?.objetivo_id)}</select></div>
        <div class="field full hidden" id="rg-objd-w"><label for="rg-objd">Describa el objetivo <span class="req">*</span></label>
          <input id="rg-objd" name="objetivo_desc" maxlength="500" value="${esc(p?.objetivo_desc || '')}"></div>
        <div class="field" data-campo="receta"><label for="rg-rec">Receta <span class="req hidden" id="rg-rec-req">*</span> ${ayuda('Se usa la receta vigente. La prueba nunca modifica la receta oficial. Si no existe, elija «Agregar receta nueva».')}</label>
          <select id="rg-rec" name="receta_version_id">${conNuevo('receta_version_id', p?.receta_version_id)}</select></div>
        <div class="field" data-campo="materia_prima"><label for="rg-mp">Materia prima</label><select id="rg-mp" name="materia_prima_id">${conNuevo('materia_prima_id', p?.materia_prima_id)}</select></div>
        <div class="field" data-campo="proveedor"><label for="rg-prov">Proveedor</label><select id="rg-prov" name="proveedor_id">${conNuevo('proveedor_id', p?.proveedor_id)}</select></div>
        <div class="field" data-campo="empaque"><label for="rg-emp">Material de empaque a probar</label><input id="rg-emp" name="empaque" maxlength="200" value="${esc(p?.empaque || '')}" placeholder="Ej. Film Chicken Chase formato 4x2"></div>
        <div class="field" data-campo="proceso"><label for="rg-proc">Proceso que cambia</label><input id="rg-proc" name="proceso" maxlength="200" value="${esc(p?.proceso || '')}"></div>
        <div class="field"><label for="rg-fecha">Fecha de ejecución</label><input id="rg-fecha" name="fecha_planeada" type="date" value="${esc(p?.fecha_planeada || '')}"></div>

        ${paso(2, 'Prioridad', 'Qué tan pronto debe atenderse')}
        <div class="field full"><div class="prio-seg" role="radiogroup" aria-label="Prioridad">${Object.entries(PRIO).map(([k, [l]]) => `<label class="prio-${k}"><input type="radio" name="prioridad" value="${k}" ${k === (p?.prioridad || 'normal') ? 'checked' : ''}>
          <span><i class="pdot"></i><b>${l}</b></span></label>`).join('')}</div></div>
        <div class="field full hidden" id="rg-just-w"><label for="rg-just" id="rg-just-l">¿Por qué es alta? <span class="req">*</span></label><input id="rg-just" name="prioridad_just" maxlength="300" value="${esc(p?.prioridad_just || '')}"></div>

        ${p ? '' : `${paso(3, 'Parámetros a evaluar', 'Calidad, Producción, Seguridad y Mantenimiento; cada área define los suyos')}
        <div class="full" id="rg-params"></div>`}
      </div>`,
    onOpen: ({ form }) => {
      bindCounters(form);
      const tipoSel = () => p?.tipo || form.elements.tipo.value;
      if (!p) selector = montarSelector(form.querySelector('#rg-params'), { getTipo: tipoSel, puedeDefinir: (area) => autoridad(tipoSel(), `evaluar_${area}`) });
      const objetivo = () => {
        const o = c.objetivos.find((x) => x.id === form.elements.objetivo_id.value);
        const otro = esOtro(o);
        form.querySelector('#rg-objd-w').classList.toggle('hidden', !otro);
        form.elements.objetivo_desc.required = otro;
      };
      const sync = () => {
        const t = c.tipos.find((x) => x.codigo === tipoSel());
        const campos = t?.campos_registro || [];
        form.querySelector('#rg-desc').textContent = t?.descripcion || '';
        form.querySelectorAll('[data-campo]').forEach((w) => w.classList.toggle('hidden', !campos.includes(w.dataset.campo)));
        const recObl = t?.codigo === 'cambio_formulacion';
        form.querySelector('#rg-rec-req').classList.toggle('hidden', !recObl);
        form.elements.receta_version_id.required = recObl && campos.includes('receta');
        form.elements.cambio.placeholder = EJEMPLO_CAMBIO[t?.codigo] || 'Describa brevemente qué se va a probar';
        const actual = form.elements.objetivo_id.value;
        form.elements.objetivo_id.innerHTML = objetivosDe(t?.codigo, actual);
        objetivo();
        selector?.recargar();
      };
      const prio = () => {
        const v = form.querySelector('input[name=prioridad]:checked')?.value;
        form.querySelector('#rg-just-w').classList.toggle('hidden', v === 'normal');
        form.querySelector('#rg-just-l').firstChild.textContent = v === 'urgente' ? '¿Por qué es urgente? ' : '¿Por qué es alta? ';
      };
      form.elements.tipo.addEventListener('change', sync); sync();
      form.elements.objetivo_id.addEventListener('change', objetivo);
      form.querySelectorAll('input[name=prioridad]').forEach((r) => r.addEventListener('change', prio)); prio();
      // "Agregar … nuevo" desde el menú
      Object.keys(ALTA).forEach((campo) => {
        const sel = form.elements[campo]; let previo = sel.value;
        sel.addEventListener('focus', () => { if (sel.value !== NUEVO) previo = sel.value; });
        sel.addEventListener('change', async () => {
          if (sel.value !== NUEVO) { previo = sel.value; return; }
          const A = ALTA[campo];
          const r = await confirmDialog({ title: A.opcion.replace('…', ''), message: A.tipo === 'receta'
            ? 'Se crea la receta y queda disponible para todas las pruebas. Sus ingredientes se capturan en la formulación de la prueba o en Recetas.'
            : 'Queda guardado en el catálogo para usarlo en otras pruebas.', confirmText: 'Agregar', input: { label: A.campo, required: true, maxlength: 150 } });
          if (!r) { sel.value = previo; return; }
          try {
            const { data: id } = must(await sb.rpc('prubind_alta_rapida', { p_tipo: A.tipo, p_nombre: r.value }));
            invalidateCat(A.cat); if (campo === 'receta_version_id') invalidateCat('productos');
            c[A.cat] = await getCat(A.cat, { force: true });
            sel.innerHTML = conNuevo(campo, id); sel.value = id; previo = id;
            toast(A.listo, 'success');
          } catch (err) { toast(errMsg(err), 'error'); sel.value = previo; }
        });
      });
    },
    onSubmit: async ({ form }) => {
      const prioridad = form.querySelector('input[name=prioridad]:checked')?.value || 'normal';
      if (!checkForm(form, { prioridad_just: (v) => (prioridad !== 'normal' && !v.trim() ? 'Explique el motivo de la prioridad.' : '') })) return false;
      const v = formValues(form);
      const t = c.tipos.find((x) => x.codigo === (p?.tipo || v.tipo));
      const campo = (k, val) => ((t?.campos_registro || []).includes(k) && val !== NUEVO ? nullIfEmpty(val) : null);
      const obj = c.objetivos.find((x) => x.id === v.objetivo_id);
      const params = selector?.leer();
      const payload = {
        objetivo_id: nullIfEmpty(v.objetivo_id), objetivo_desc: esOtro(obj) ? nullIfEmpty(v.objetivo_desc) : null, cambio: v.cambio.trim(),
        prioridad, prioridad_just: prioridad === 'normal' ? null : v.prioridad_just,
        receta_version_id: campo('receta', v.receta_version_id), materia_prima_id: campo('materia_prima', v.materia_prima_id),
        proveedor_id: campo('proveedor', v.proveedor_id), empaque: campo('empaque', v.empaque), proceso: campo('proceso', v.proceso),
        fecha_planeada: nullIfEmpty(v.fecha_planeada),
      };
      if (p) { mustRow(await sb.from('pruebas_prubind').update(payload).eq('id', p.id).select('id')); toast('Registro actualizado.', 'success'); return true; }
      const { data } = must(await sb.from('pruebas_prubind').insert({ ...payload, tipo: v.tipo, registrado_por: state.profile.id }).select('id, folio').single());
      avisar('nueva_prueba', data.id);
      // Parámetros del área de quien registra
      try {
        if (params.ids.length) must(await sb.rpc('prubind_definir_parametros', { p_prueba: data.id, p_agregar: params.ids, p_quitar: [] }));
      } catch (err) { toast(`Prueba ${data.folio} registrada, pero: ${errMsg(err)}. Revise los parámetros en el expediente.`, 'warning', 8000); return data.id; }
      toast(`Prueba registrada con folio ${data.folio}.`, 'success');
      return data.id;
    },
  });
}


// ============================== EXPEDIENTE ==============================
async function cargar(id) {
  const [p, e] = await Promise.all([
    sb.from('v_pruebas_prubind').select('*').eq('id', id).maybeSingle(),
    sb.rpc('prubind_eval_estado', { p_prueba: id }),
  ]);
  if (p.error) throw p.error;
  if (e.error) throw e.error;
  return [p.data, e.data];
}

async function renderDetalle(id, tab) {
  root.innerHTML = '<div class="card"><div class="skeleton" style="height:28px;width:40%"></div><div class="skeleton" style="height:16px;margin-top:12px"></div></div>';
  try { [P, E] = await cargar(id); } catch (err) { root.innerHTML = errorState(err); refreshIcons(); return; }
  if (!root) return;
  if (!P) {
    root.innerHTML = `<div class="card">${emptyState({ ico: 'search-x', title: 'Prueba no encontrada', text: 'Pudo haber sido eliminada o no tiene acceso.', action: `<a class="btn secondary" href="#/pruebas">${icon('arrow-left')} Volver a pruebas</a>` })}</div>`;
    refreshIcons(); return;
  }
  // Pestañas de versiones anteriores
  const ALIAS_TAB = { preparacion: 'registro', ejecucion: 'proceso', evaluacion: 'resultados' };
  const actual = etapaDe(P.estado, E);
  tabActual = ALIAS_TAB[tab] || tab || (actual === 'fin' ? 'cierre' : actual);
  ejecSel = null;
  pintar();
  root.addEventListener('click', onClick);
  await cargarTab();
}

function pintar() {
  const et = etapasDe(P.tipo);
  const cur = etapaDe(P.estado, E);
  const n = cur === 'fin' ? et.length : et.findIndex(([k]) => k === cur);
  const tabs = [...et, ['seguimiento', 'Seguimiento', 'messages-square'], ['evidencia', 'Evidencia', 'paperclip']];
  root.innerHTML = `
    <a class="back-link" href="#/pruebas">${icon('arrow-left')} Pruebas</a>
    <section class="prueba-head card">
      <div class="ph-top">
        <div class="ph-title">
          <span class="eyebrow">${esc(P.folio)} · ${esc(P.tipo_nombre)}${P.ejecucion_actual > 1 ? ` · ejecución #${P.ejecucion_actual}` : ''}</span>
          <h1>${esc(P.cambio)}</h1>
          <p>${esc(objetoTxt(P) || 'Sin objeto especificado')} · Registró ${esc(P.registrado_por_nombre)} el ${fmtDateTime(P.created_at)}</p>
        </div>
        <div class="ph-estado">${estadoPill(P.estado)} ${prioPill(P.prioridad)}</div>
      </div>
      <ol class="stepper ${P.estado === 'cancelada' ? 'is-cancelled' : ''}" aria-label="Etapas de la prueba">${et.map(([k, l], i) => {
        const done = i < n; const ultima = i === et.length - 1;
        const cls = done ? `done ${ultima && P.estado === 'cerrada_rechazada' ? 'rechazada' : ultima && P.estado === 'cerrada_aprobada' ? 'aprobada' : ''}` : i === n ? 'current' : '';
        return `<li class="${cls}"><button type="button" class="st-dot" data-tab="${k}" aria-label="${esc(l)}">${done ? icon('check') : i + 1}</button><span class="st-lbl">${esc(l)}</span></li>`;
      }).join('')}</ol>
      ${P.estado === 'cancelada' ? aviso(`<b>Prueba cancelada</b> por ${esc(P.cancelado_por_nombre || '—')} el ${fmtDateTime(P.cancelado_at)}: ${esc(P.motivo_cancelacion)}`, 'warn', 'ban') : ''}
      ${siguientePaso()}
      <div class="ph-actions">${accionesHTML()}</div>
    </section>
    <div class="tabs mt" role="tablist">${tabs.map(([k, l, ic]) => `<button role="tab" data-tab="${k}" class="${k === tabActual ? 'active' : ''}" aria-selected="${k === tabActual}">${icon(ic)} ${esc(l)}</button>`).join('')}</div>
    <div id="pd-pane"></div>`;
  refreshIcons();
}

// Qué falta y a quién le corresponde
function siguientePaso() {
  const e = P.estado;
  // Áreas cuyo responsable (usted) aún no define sus parámetros ni indicó que no tiene nada que evaluar
  const sinPar = E.sin_parametros || [];
  const porDefinir = AREAS_ORDEN.filter((a) => !(E.areas || []).includes(a) && !sinPar.includes(a) && autoridad(P.tipo, `evaluar_${a}`));
  const definir = porDefinir.length
    ? [`Definir los parámetros de ${porDefinir.map((a) => AREAS[a].label).join(' y ')} o indicar que su área no tiene nada que evaluar (pestaña Registro).`, true] : null;
  const registro = puedeEn(P, 'preparar')
    ? ['Iniciar la prueba cuando esté lista. Las áreas que aún no definen sus parámetros pueden agregarlos durante la prueba.', true]
    : definir || [`Esperando a que ${P.registrado_por_nombre || 'quien registró la prueba'} la inicie.`, false];
  const misAreas = AREAS_ORDEN.filter((a) => autoridad(P.tipo, `evaluar_${a}`) || autoridad(P.tipo, `capturar_${a}`));
  const proceso = definir || [misAreas.length
    ? 'Registrar los parámetros de su área (para toda la prueba o por batch). Cuando su área termine puede evaluar y dar su veredicto, sin esperar a las demás.'
    : 'Cada área registra sus parámetros, los evalúa y da su veredicto. Al terminar, quien registró la prueba la da por terminada.', misAreas.length > 0 || puedeEn(P, 'preparar')];
  const evalua = E.eval_faltantes > 0
    ? [`Cada área evalúa sus parámetros: Cumple, No cumple o No se pudo determinar (${E.eval_faltantes} por evaluar).`, puedeEn(P, 'evaluar')]
    : [`Cada área que participó da su veredicto y recomendación (${E.recom_faltantes} pendiente(s)); después pasa sola a dictamen.`, puedeEn(P, 'evaluar')];
  const msgs = {
    registrada: definir && !puedeEn(P, 'preparar') ? definir : registro, en_preparacion: registro, preparada: registro, en_ejecucion: proceso,
    en_evaluacion: evalua, pendiente_resultados: evalua,
    pendiente_dictamen: ['Alta Dirección revisa los resultados y los veredictos de las áreas y emite el dictamen; si lo aprueba, queda autorizado implementar el cambio.', autoridad(P.tipo, 'dictaminar')],
    requiere_repeticion: ['Iniciar una nueva ejecución vinculada a este registro.', puedeEn(P, 'preparar') || autoridad(P.tipo, 'dictaminar')],
    aprobada: ['Cerrar la prueba (Gerencia de Procesos y Mejora Continua). El cambio ya quedó autorizado en el dictamen.', autoridad(P.tipo, 'cerrar')],
    rechazada: ['Cerrar la prueba (Gerencia de Procesos y Mejora Continua).', autoridad(P.tipo, 'cerrar')],
  }[e];
  if (!msgs) return '';
  return `<div class="next-step ${msgs[1] ? 'mine' : ''}">${icon(msgs[1] ? 'hand' : 'navigation')}<span><b>${msgs[1] ? 'Te corresponde:' : 'Siguiente paso:'}</b> ${esc(msgs[0])}</span></div>`;
}

function accionesHTML() {
  const e = P.estado, b = [];
  const B = (a, ico, t, cls = 'secondary') => b.push(`<button class="btn ${cls}" data-pa="${a}">${icon(ico)} ${esc(t)}</button>`);
  if (['registrada', 'en_preparacion', 'preparada'].includes(e) && puedeEn(P, 'preparar')) { B('iniciar', 'play', 'Iniciar prueba', 'primary btn-iniciar'); B('editar', 'pencil', 'Editar registro'); }

      const payload = { nombre: v.nombre.replace(/\s+/g, ' '), puesto_id: v.puesto_id || null, area_id: v.area_id || null };
      if (!self) payload.rol = v.rol;

      let nuevaFoto = null;
      if (fotoBlob) nuevaFoto = await subirFoto(fotoBlob);
      if (nuevaFoto) payload.foto_url = nuevaFoto;
      else if (fotoExistente) payload.foto_url = fotoExistente;
      else if (quitarFoto) payload.foto_url = null;

      let id = u?.id;
      try {
        if (u) {
          mustRow(await sb.from('usuarios_prubind').update(payload).eq('id', u.id).select('id'));

        if (err.code === '23505') { fieldError(form.elements.email, 'Ese correo ya está registrado en Pruebas industriales.'); return false; }
        throw err;
      }

      invalidateCat('usuarios');
      if (!u && cuentaEstado === 'nueva') {
        try {
          await crearCuenta(payload.email, v.password);
          toast(`${payload.nombre} registrado y con cuenta creada. Comparte su contraseña temporal de forma privada.`, 'success', 8000);
        } catch (err) {
          toast(`${payload.nombre} quedó registrado, pero no se pudo crear su cuenta: ${String(err.message).replace(/\.$/, '')}. Usa el botón de llave en la tabla para reintentar.`, 'warning', 10000);
        }
      } else {
        toast(u ? 'Usuario actualizado.' : `${payload.nombre} registrado. Ya puede entrar con su cuenta Pet's Table.`, 'success', 6000);
      }
      // Si el admin se editó a sí mismo, refrescar encabezado y permisos
      if (self) {
        Object.assign(state.profile, { nombre: payload.nombre, foto_url: 'foto_url' in payload ? payload.foto_url : state.profile.foto_url });
        if (payload.puesto_id !== state.profile.puesto_id) toast('Cambió tu puesto: recarga la página para aplicar tus nuevas autoridades.', 'info', 7000);
        const top = document.getElementById('top-avatar');
        if (top) top.outerHTML = avatarHTML(state.profile.nombre, state.profile.foto_url).replace('class="avatar ', 'id="top-avatar" class="avatar ');
        document.getElementById('top-name').textContent = state.profile.nombre;
      }
    },
  });
}

    $('#view').innerHTML = `<div class="card">${esc(errMsg(err))}</div>`;
  } finally {
    routing = false;
    if (pendingRoute) { pendingRoute = false; route(); }
  }
}

// ---------------- Eventos globales ----------------
function bindGlobalEvents() {
  document.addEventListener('click', async (e) => {
    // Al elegir una vista del menú (aunque sea la actual) el menú se oculta
    if (e.target.closest('#nav a, #mobile-nav a')) closeMenu();
    const a = e.target.closest('[data-action]');
    if (!a) return;
    switch (a.dataset.action) {
      case 'toggle-menu': toggleMenu(); break;
      case 'close-menu': closeMenu(); break;
      case 'toggle-theme': cycleTheme(); break;
      case 'go-profile': navigate('#/perfil'); break;
      case 'go-home': navigate('#/panel'); break;
      case 'fab-prueba': {
        const id = await openRegistro();
        if (id) navigate(`#/pruebas?id=${id}`);
        break;
      }
      case 'logout': await logout(); break;
      case 'reload-app': location.reload(); break;
      case 'update-later': $('#update-bar').classList.add('hidden'); break;
      case 'toggle-pw': togglePw(a); break;
      case 'forgot': await forgotPassword(); break;
      default: break;
    }
  });
  $('#login-form').addEventListener('submit', login);
  window.addEventListener('online', updateNet);
  window.addEventListener('offline', updateNet);
  updateNet();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('menu-open') && !document.querySelector('.modal')) closeMenu();
  });
}

// Menú lateral: siempre oculto; se despliega con el botón y se cierra al elegir una vista
function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  document.querySelector('.top .menu-btn')?.setAttribute('aria-expanded', String(open));
}
function toggleMenu() { setMenu(!document.body.classList.contains('menu-open')); }
function closeMenu() { setMenu(false); }

function togglePw(btn) {
  const inp = btn.parentElement.querySelector('input');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  btn.innerHTML = icon(show ? 'eye-off' : 'eye');
  refreshIcons();
}

function updateNet() {
  const el = $('#net-status');
  if (!el) return;
  const on = navigator.onLine;
  el.textContent = on ? 'En vivo' : 'Sin conexión';
  el.classList.toggle('off', !on);
  if (booted && !on) toast('Sin conexión. Los cambios no se guardarán hasta recuperar la red.', 'warning');
}

// Fecha completa y hora con segundos, hora de Ciudad de México
function startClock() {
  const dEl = $('#clock-date'), tEl = $('#clock-time');
  const parts = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const time = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const tick = () => {
    const now = new Date();
    const p = Object.fromEntries(parts.formatToParts(now).map((x) => [x.type, x.value]));
    const wd = p.weekday.charAt(0).toUpperCase() + p.weekday.slice(1);
    dEl.textContent = `${wd} ${p.day} de ${p.month} del ${p.year}`;
    tEl.textContent = time.format(now);
  };
  tick(); setInterval(tick, 1000);
}

// ---------------- Tema ----------------
function currentTheme() { return prefs.get('prubind.theme') || 'system'; }
function setTheme(t) {
  if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); prefs.set('prubind.theme', t); }
  else { document.documentElement.removeAttribute('data-theme'); prefs.del('prubind.theme'); }
  updateThemeButton();
  // Solo re-colorea las gráficas (sin volver a cargar la vista): cambio inmediato
  requestAnimationFrame(restyleCharts);
}
window.__prubindSetTheme = setTheme;
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
  if (currentTheme() !== 'system') return;
  updateThemeButton();
  requestAnimationFrame(restyleCharts);
});
function effectiveDark() {
  const t = currentTheme();
  return t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function cycleTheme() { setTheme(effectiveDark() ? 'light' : 'dark'); }
function updateThemeButton() {
  const dark = effectiveDark();
  const btn = document.querySelector('.theme-toggle');
  btn.classList.toggle('is-dark', dark);
  btn.setAttribute('aria-label', dark ? 'Modo oscuro activo. Cambiar a modo claro' : 'Modo claro activo. Cambiar a modo oscuro');
}

// ---------------- Autenticación ----------------
async function login(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const msg = $('#login-msg');
  msg.className = 'login-msg hidden';
  if (!checkForm(form, {
    email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo corporativo @petstable.mx.'),
  })) return;
  const btn = $('#login-submit');
  if (btn.disabled) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Verificando…';
  prefs.set('prubind.remember', $('#login-remember').checked ? '1' : '0');
  const { error } = await sb.auth.signInWithPassword({
    email: form.email.value.trim().toLowerCase(),
    password: form.password.value,
  });
  if (error) {
    btn.disabled = false; btn.innerHTML = `${icon('log-in')} Entrar`; refreshIcons();
    msg.className = 'login-msg error';
    msg.textContent = /invalid login credentials/i.test(error.message)
      ? 'Correo o contraseña incorrectos.'
      : /email not confirmed/i.test(error.message) ? 'Tu correo aún no está confirmado. Revisa tu bandeja de entrada.'
      : /rate limit|too many/i.test(error.message) ? 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'
      : errMsg(error);
    return;
  }
  form.password.value = '';
}

async function logout() {
  // Deja de recibir avisos en este dispositivo (podría usarlo otra persona)
  await push.desactivar().catch(() => {});
  // scope "local": cierra solo esta sesión (otras apps de Pet's Table comparten la cuenta)
  await sb.auth.signOut({ scope: 'local' });
  state.profile = null; state.session = null;
  history.replaceState(null, '', location.pathname);
  showLogin();
  toast('Sesión cerrada.', 'success');
}

async function forgotPassword() {
  const email = $('#login-email').value.trim();
  await openModal({
    title: 'Restablecer contraseña',
    subtitle: 'Te enviaremos un enlace a tu correo corporativo.',
    size: 'sm', submitText: 'Enviar enlace', confirmDiscard: false,
    body: `<div class="field"><label for="fp-email">Correo corporativo <span class="req">*</span></label>
      <input id="fp-email" name="email" type="email" required maxlength="120" value="${esc(email)}" placeholder="nombre@petstable.mx"></div>
      <p class="hint">Esta contraseña es la misma de tu cuenta Pet's Table en las demás aplicaciones.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo @petstable.mx.') })) return false;
      const { error } = await sb.auth.resetPasswordForEmail(form.email.value.trim().toLowerCase(), { redirectTo: `${location.origin}/` });
      if (error) throw error;
      toast('Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.', 'success', 7000);
    },
  });
}

async function recoveryFlow() {
  hideSplash();
  $('#login').classList.remove('hidden');
  await openModal({
    title: 'Define tu nueva contraseña', size: 'sm', submitText: 'Guardar contraseña', confirmDiscard: false,
    body: `<div class="field"><label for="np1">Nueva contraseña <span class="req">*</span></label>
        <input id="np1" name="p1" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <div class="field"><label for="np2">Confirmar contraseña <span class="req">*</span></label>
        <input id="np2" name="p2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <p class="hint">Mínimo 8 caracteres. Combina letras, números y símbolos.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { p2: (v, f) => (v !== f.p1.value ? 'Las contraseñas no coinciden.' : '') })) return false;
      const { error } = await sb.auth.updateUser({ password: form.p1.value });
      if (error) throw error;
      toast('Contraseña actualizada.', 'success');
    },
  });
  history.replaceState(null, '', location.pathname);
  const { data } = await sb.auth.getSession();
  if (data.session) { state.session = data.session; await loadProfileAndStart(); } else showLogin();
}

// Si la sesión inicial no dispara eventos (p. ej. sin sesión guardada), mostrar login
setTimeout(async () => {
  if (!$('#splash').classList.contains('hidden')) {
    const { data } = await sb.auth.getSession();
    if (!data.session) showLogin();
  }
}, 2500);

Object.assign(__exp, { rolTexto, setTheme });
return __exp;
})();
})();</script>
